  } else if (type === 'active') {
    badge = `<span class="badge calm">${icon('leaf')}</span>`; title = 'Aktive Erholung'; sub = 'Spaziergang oder Radfahren';
    body = `<p class="muted" style="margin:14px 0 18px">Locker bewegen, 30–60 Minuten, ohne Leistungsdruck. Wenn du magst, kannst du den Lauf-Modus einzeln starten.</p>`;
  } else {
    badge = `<span class="badge rest">${icon('moon')}</span>`; title = 'Pausentag'; sub = 'Erholung ist Teil des Trainings';
    body = `<p class="muted" style="margin:14px 0 18px">Deine Muskeln wachsen in der Pause. Trinken, schlafen, vielleicht ein Spaziergang.</p>`;
  }

  if (fullDone.length) {
    const s = fullDone[fullDone.length - 1];
    body += `<div class="note accent" style="margin-bottom:14px">${icon('check')}<span><strong>Heute erledigt.</strong> ${esc(fmtMinutes(s.durationSec || 0))}${s.prs && s.prs.length ? ` · ${plural(s.prs.length, 'neuer Bestwert', 'neue Bestwerte')}` : ''}. Stark!</span></div>`;
  } else if (runDone.length) {
    body += `<div class="note calm" style="margin-bottom:14px">${icon('run')}<span><strong>Lauf erledigt:</strong> ${esc(fmtMinutes(runDone[runDone.length - 1].run?.actualSec || 0))}.</span></div>`;
  }
  if (!fullDone.length && type !== 'train') {
    body += `<div class="note" style="margin-bottom:14px">${icon('info')}<span>Heute ist kein Trainingstag. Du kannst trotzdem trainieren – plane danach wieder einen Pausentag ein.</span></div>`;
  } else if (!fullDone.length && yesterdayTrained) {
    body += `<div class="note warn" style="margin-bottom:14px">${icon('info')}<span>Du hast gestern schon trainiert. Zwischen zwei Trainingstagen sollte ein Pausentag liegen.</span></div>`;
  }

  const startLabel = fullDone.length ? 'Noch eine Einheit starten' : 'Training starten';
  const primaryIsTraining = type === 'train' && !fullDone.length;
  const disabled = data.activeWorkout ? 'disabled' : '';
  if (type === 'active' && !fullDone.length) {
    actions = `<button class="btn btn-calm btn-xl btn-block" data-action="startRun" ${disabled}>${icon('run')} Lauf-Modus starten</button>
      <button class="btn btn-secondary btn-block" style="margin-top:8px" data-action="startWorkout" ${disabled}>${startLabel}</button>`;
  } else {
    actions = `<button class="btn ${primaryIsTraining || type === 'rest' ? 'btn-primary btn-xl' : 'btn-secondary'} btn-block" data-action="startWorkout" ${disabled}>${icon('play')} ${startLabel}</button>
      <button class="btn btn-plain btn-block" style="margin-top:4px" data-action="startRun" ${disabled}>${icon('run', 'ic-sm')} Nur Lauf-Modus starten</button>`;
  }
  return `<div class="card" style="margin-top:12px">
    <div class="today-type">${badge}<div class="grow"><div class="eyebrow">Heute</div><h2 class="title-2">${title}</h2><div class="muted small">${sub}</div></div></div>
    ${body}${actions}
  </div>`;
}

function weekStripCard(today) {
  const mon = mondayOf(today);
  const start = data.settings.startDate;
  let cells = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(mon, i);
    const type = scheduleFor(d);
    const ss = sessionsOn(d);
    const full = ss.some(s => s.type === 'full');
    const run = ss.some(s => s.type === 'run');
    const past = dayNum(d) < dayNum(today);
    const inPlan = dayNum(d) >= dayNum(start);
    let mk, label;
    if (full) { mk = `<span class="mk done">${icon('check')}</span>`; label = 'Training erledigt'; }
    else if (run) { mk = `<span class="mk run">${icon('run')}</span>`; label = 'Lauf erledigt'; }
    else if (type === 'train' && past && inPlan) { mk = `<span class="mk missed">${icon('x')}</span>`; label = 'Training ausgelassen'; }
    else if (type === 'train') { mk = `<span class="mk plan-train">${icon('dumbbell')}</span>`; label = 'Training geplant'; }
    else if (type === 'active') { mk = `<span class="mk plan-active">${icon('leaf')}</span>`; label = 'Aktive Erholung'; }
    else { mk = `<span class="mk"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span>`; label = 'Pause'; }
    cells += `<div class="wday ${d === today ? 'today' : ''}" aria-label="${DAY_NAMES[i]}: ${label}"><span class="dn">${DAY_SHORT[i]}</span><span class="dd">${parseDate(d).getDate()}</span>${mk}</div>`;
  }
  const si = streakInfo();
  const streakText = si.streak > 0
    ? `<strong>${plural(si.streak, 'Woche', 'Wochen')}</strong> ohne ausgelassenes Training`
    : si.curReq > 0 ? `Diese Woche: <strong>${si.curDone} von ${si.curReq}</strong> Trainings – schaff alle für deine erste Serie.` : 'Deine Serie startet mit der ersten Trainingswoche.';
  return `<div class="card" style="margin-top:12px">
    <div class="row between"><h2>Diese Woche</h2><span class="faint small">${si.curDone} / ${si.curReq || si.weekTarget} Trainings</span></div>
    <div class="week-strip">${cells}</div>
    <div class="streak">${icon('flame')}<span>${streakText}</span></div>
  </div>`;
}

function hintCards() {
  let out = '';
  const s = data.settings;
  const now = Date.now();
  const needBackup = data.sessions.length >= 3 && (!s.lastBackupAt || now - s.lastBackupAt > 14 * 864e5) && (!s.backupSnoozeUntil || now > s.backupSnoozeUntil);
  if (needBackup) {
    out += `<div class="card" style="margin-top:12px"><div class="row">${icon('shield')}<h2 class="grow">Zeit für ein Backup</h2></div>
      <p class="muted small" style="margin-top:6px">${s.lastBackupAt ? `Letztes Backup vor ${Math.floor((now - s.lastBackupAt) / 864e5)} Tagen.` : 'Du hast noch kein Backup.'} Deine Daten liegen nur auf diesem Gerät.</p>
      <div class="btn-row" style="margin-top:12px"><button class="btn btn-secondary" data-action="snoozeBackup">Später</button><button class="btn btn-primary" data-action="export">Exportieren</button></div></div>`;
  }
  if (isIOS() && !isStandalone() && !s.installHintDismissed) {
    out += `<div class="card" style="margin-top:12px"><div class="row">${icon('share')}<h2 class="grow">Als App installieren</h2><button class="icon-btn" data-action="dismissInstall" aria-label="Hinweis schließen">${icon('x')}</button></div>
      <p class="muted small" style="margin-top:4px">Tippe in Safari auf <b>Teilen</b> und dann auf <b>„Zum Home-Bildschirm“</b>. Dann läuft ${APP_NAME} im Vollbild und offline.</p></div>`;
  }
  return out;
}

/* ---- Abschluss nach Woche 8 ---- */
function planPeriodSessions() {
  const a = dayNum(data.settings.startDate), b = a + PLAN.weeks * 7 - 1;
  return data.sessions.filter(s => dayNum(s.date) >= a && dayNum(s.date) <= b);
}
function viewCompletion() {
  const ss = planPeriodSessions();
  const full = ss.filter(s => s.type === 'full');
  const planned = trainingDayCount() * PLAN.weeks;
  let rows = '';
  for (const ex of PLAN.exercises) {
    const withEx = ss.filter(s => sessionBest(s, ex.id));
    if (!withEx.length) continue;
    const f = sessionBest(withEx[0], ex.id), l = sessionBest(withEx[withEx.length - 1], ex.id);
    const df = exDef(ex.id, f.variant), dl = exDef(ex.id, l.variant);
    const vf = f.variant !== 'normal' ? ` <small>${LEVEL_LABEL[f.variant]}</small>` : '';
    const vl = l.variant !== 'normal' ? ` <small>${LEVEL_LABEL[l.variant]}</small>` : '';
    rows += `<div><span class="l">${esc(ex.name)}</span><span class="r">${fmtValShort(f.v, df)}${vf} → <b>${fmtValShort(l.v, dl)}</b>${vl}</span></div>`;
  }
  const runs = ss.filter(s => s.run && s.run.actualSec > 0);
  if (runs.length) rows += `<div><span class="l">Joggen</span><span class="r">${fmtMinDec(runs[0].run.actualSec)} → <b>${fmtMinDec(runs[runs.length - 1].run.actualSec)} Min.</b></span></div>`;
  return `<div class="card gold pop" style="margin-bottom:12px">
    <div class="row">${icon('trophy', 'ic-lg')}<div class="grow"><div class="eyebrow">Plan abgeschlossen</div><h2 class="title-2">8 Wochen geschafft!</h2></div></div>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="k">Trainings</div><div class="v">${full.length}<small> / ${planned}</small></div></div>
      <div class="stat"><div class="k">Gelaufen</div><div class="v">${Math.round(sum(runs.map(s => s.run.actualSec)) / 60)}<small> Min.</small></div></div>
    </div>
    <h3 class="title-3" style="margin-top:18px">Vorher → Nachher</h3>
    <p class="faint small">Bester Satz der ersten vs. der letzten Einheit</p>
    <div class="ex-lines" style="margin-top:6px">${rows || '<div><span class="l faint">Noch keine Werte im Planzeitraum.</span></div>'}</div>
    <div style="display:grid;gap:8px;margin-top:16px">
      <button class="btn btn-primary btn-block" data-action="continuePlan">Mit Phase Steigern weitermachen</button>
      <button class="btn btn-secondary btn-block" data-action="restartPlan">Plan neu starten</button>
    </div>
  </div>`;
}

/* ---------------------------- Fortschritt ---------------------------- */
function viewProgress() {
  const tabs = [['charts', 'Kurven'], ['best', 'Bestwerte'], ['history', 'Verlauf']];
  let body;
  if (!data.sessions.length) {
    body = `<div class="card" style="text-align:center;padding:34px 22px">${icon('progress', 'ic-lg')}
      <h2 style="margin-top:12px">Noch keine Einheiten</h2>
      <p class="muted small" style="margin-top:6px">Nach deinem ersten Training siehst du hier deine Kurven, Bestwerte und den Verlauf.</p></div>`;
  } else body = ui.progTab === 'best' ? bestHtml() : ui.progTab === 'history' ? historyHtml() : chartsHtml();
  return `<header class="page-head"><h1 class="large-title">Fortschritt</h1></header>
    <div class="seg lg" role="tablist" style="margin-bottom:16px">${tabs.map(([id, l]) => `<button role="tab" data-action="progTab" data-ptab="${id}" aria-pressed="${ui.progTab === id}" aria-selected="${ui.progTab === id}">${l}</button>`).join('')}</div>
    ${body}`;
}

function exSeries(exId) {
  return data.sessions.map(s => ({ s, b: sessionBest(s, exId) })).filter(o => o.b)
    .map(({ s, b }) => ({ t: s.startedAt / 864e5, date: s.date, y: b.v, variant: b.variant }));
}
function runSeries() {
  return data.sessions.filter(s => s.run && s.run.actualSec > 0)
    .map(s => ({ t: s.startedAt / 864e5, date: s.date, y: Math.round(s.run.actualSec / 6) / 10, variant: s.run.mode === 'intervals' ? 'iv' : 'cont' }));
}
function weeklyCounts() {
  const info = planInfo();
  const n = Math.max(PLAN.weeks, info.cont ? info.week : 0);
  const start = dayNum(data.settings.startDate);
  const counts = Array(n).fill(0);
  for (const s of data.sessions) {
    if (s.type !== 'full') continue;
    const w = Math.floor((dayNum(s.date) - start) / 7);
    if (w >= 0 && w < n) counts[w]++;
  }
  const curW = info.before ? 0 : info.week;
  return counts.map((v, i) => ({ label: `W${i + 1}`, v: i + 1 <= curW ? v : null, cur: i + 1 === curW }));
}

const CHARTS = {
  pushup: { title: 'Liegestütze', sub: 'Bester Satz pro Einheit', unit: 'Wdh.', series: () => exSeries('pushup'), kind: 'variant' },
  pullup: { title: 'Klimmzüge', sub: 'Bester Satz pro Einheit', unit: 'Wdh.', series: () => exSeries('pullup'), kind: 'variant' },
  plank: { title: 'Plank', sub: 'Längste Haltezeit pro Einheit', unit: 'Sek.', series: () => exSeries('plank'), kind: 'variant' },
  jog: { title: 'Joggen', sub: 'Minuten pro Lauf', unit: 'Min.', series: runSeries, kind: 'run', minMax: 30 },
};
const RUN_LABEL = { iv: 'Intervalle', cont: 'Am Stück' };
function markerKind(chart, variant) {
  if (chart.kind === 'run') return variant === 'iv' ? 'hollow' : 'filled';
  return variant === 'easy' ? 'hollow' : variant === 'hard' ? 'diamond' : 'filled';
}
function seriesLabel(chart, variant) { return chart.kind === 'run' ? RUN_LABEL[variant] : LEVEL_LABEL[variant]; }
function fmtNum(v) { return String(v).replace('.', ','); }

function chartsHtml() {
  let out = '';
  for (const [id, c] of Object.entries(CHARTS)) {
    const pts = c.series();
    const last = pts[pts.length - 1];
    const best = pts.length ? Math.max(...pts.map(p => p.y)) : null;
    const table = pts.length ? `<details class="table-view"><summary>${icon('chev', 'ic-sm')} Werte als Tabelle</summary>
      <table><thead><tr><th>Datum</th><th>${c.kind === 'run' ? 'Art' : 'Variante'}</th><th>${c.unit}</th></tr></thead><tbody>
      ${pts.slice().reverse().map(p => `<tr><td>${esc(fmtDateShort(p.date))}</td><td>${esc(seriesLabel(c, p.variant))}</td><td>${fmtNum(p.y)}</td></tr>`).join('')}</tbody></table></details>` : '';
    out += `<div class="card chart-card">
      <div class="chart-head"><div><h2>${c.title}</h2><div class="sub">${c.sub}${best !== null ? ` · Bestwert ${fmtNum(best)} ${c.unit}` : ''}</div></div>
        ${last ? `<div class="kpi"><b>${fmtNum(last.y)}</b><small>${c.unit} zuletzt</small></div>` : ''}</div>
      ${pts.length ? `<div class="chart" data-chart="${id}" tabindex="0" aria-label="${c.title}: ${pts.length} Werte, zuletzt ${fmtNum(last.y)} ${c.unit}"></div><div class="chart-legend" data-legend="${id}"></div>`
        : `<div class="chart-empty">Noch keine Werte.</div>`}
      ${table}
    </div>`;
  }
  const wk = weeklyCounts();
  out += `<div class="card chart-card">
    <div class="chart-head"><div><h2>Trainings pro Woche</h2><div class="sub">Ziel: ${trainingDayCount()} pro Woche (Plan-Wochen)</div></div></div>
    <div class="chart" data-chart="weeks" tabindex="0" aria-label="Trainings pro Woche"></div>
    <details class="table-view"><summary>${icon('chev', 'ic-sm')} Werte als Tabelle</summary><table><thead><tr><th>Woche</th><th></th><th>Trainings</th></tr></thead><tbody>
      ${wk.filter(b => b.v !== null).map(b => `<tr><td>${b.label.replace('W', 'Woche ')}</td><td></td><td>${b.v}</td></tr>`).join('')}</tbody></table></details>
  </div>`;
  return out;
}

function niceScale(maxV, target = 4) {
  if (!(maxV > 0)) return { max: target, step: 1 };
  const raw = maxV / target;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= raw) || 10 * mag;
  const st = step < 1 ? 1 : step;
  return { max: Math.ceil((maxV * 1.08) / st) * st, step: st };
}
function markerSvg(kind, x, y) {
  x = Number(x); y = Number(y);
  if (kind === 'hollow') return `<circle class="dot hollow" cx="${x}" cy="${y}" r="4.5"/>`;
  if (kind === 'diamond') return `<path class="dot" d="M${x.toFixed(1)} ${(y - 6.5).toFixed(1)}L${(x + 6.5).toFixed(1)} ${y.toFixed(1)}L${x.toFixed(1)} ${(y + 6.5).toFixed(1)}L${(x - 6.5).toFixed(1)} ${y.toFixed(1)}Z"/>`;
  return `<circle class="dot" cx="${x}" cy="${y}" r="5"/>`;
}
function legendMarker(kind) {
  const inner = kind === 'hollow' ? '<circle cx="6" cy="6" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/>'
    : kind === 'diamond' ? '<path d="M6 0.8L11.2 6 6 11.2 0.8 6Z" fill="var(--accent)"/>' : '<circle cx="6" cy="6" r="5" fill="var(--accent)"/>';
  return `<svg viewBox="0 0 12 12" aria-hidden="true">${inner}</svg>`;
}

function drawCharts() {
  for (const el of $$('[data-chart]')) {
    const id = el.dataset.chart;
    const W = Math.max(260, Math.round(el.clientWidth || 320));
    if (id === 'weeks') drawBarChart(el, W, weeklyCounts(), trainingDayCount());
    else drawLineChart(el, W, CHARTS[id]);
  }
}

function drawLineChart(el, W, c) {
  const pts = c.series();
  const H = 196, m = { l: 36, r: 16, t: 26, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const { max: ymax, step } = niceScale(Math.max(c.minMax || 0, ...pts.map(p => p.y)));
  const t0 = pts[0].t, t1 = pts[pts.length - 1].t, span = t1 - t0;
  const X = t => span === 0 ? m.l + iw / 2 : m.l + ((t - t0) / span) * iw;
  const Y = v => m.t + ih - (v / ymax) * ih;
  let g = '';
  for (let v = 0; v <= ymax + 1e-9; v += step) {
    const y = Y(v).toFixed(1);
    g += `<line class="${v === 0 ? 'axis' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/>`;
    g += `<text class="tick" x="${m.l - 7}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${fmtNum(Math.round(v * 10) / 10)}</text>`;
  }
  g += `<text class="ylab" x="${m.l - 7}" y="${m.t - 12}" text-anchor="end">${c.unit}</text>`;
  // X-Achse: Datumsbeschriftungen mit Mindestabstand
  const idxs = pts.length <= 4 ? pts.map((_, i) => i) : [0, Math.round((pts.length - 1) / 3), Math.round((2 * (pts.length - 1)) / 3), pts.length - 1];
  let lastX = -1e9, seen = new Set();
  for (const i of idxs) {
    const p = pts[i], x = X(p.t);
    if (seen.has(p.date) || x - lastX < 46) continue;
    seen.add(p.date); lastX = x;
    const anchor = span === 0 ? 'middle' : x < m.l + 20 ? 'start' : x > W - m.r - 20 ? 'end' : 'middle';
    g += `<text class="tick" x="${x.toFixed(1)}" y="${H - 8}" text-anchor="${anchor}">${esc(fmtDateShort(p.date))}</text>`;
  }
  // Variantenwechsel
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].variant === pts[i - 1].variant) continue;
    const x = ((X(pts[i].t) + X(pts[i - 1].t)) / 2);
    g += `<line class="vmark" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${m.t - 4}" y2="${m.t + ih}"/>`;
    const anchor = x > W - m.r - 40 ? 'end' : x < m.l + 40 ? 'start' : 'middle';
    g += `<text class="vlab" x="${x.toFixed(1)}" y="${m.t - 8}" text-anchor="${anchor}">→ ${esc(seriesLabel(c, pts[i].variant))}</text>`;
  }
  // Fläche + Linie
  const coords = pts.map(p => [X(p.t), Y(p.y)]);
  if (coords.length > 1) {
    const line = coords.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
    g += `<path class="area" d="${line}L${coords[coords.length - 1][0].toFixed(1)} ${Y(0).toFixed(1)}L${coords[0][0].toFixed(1)} ${Y(0).toFixed(1)}Z"/>`;
    g += `<path class="line" d="${line}"/>`;
  }
  const dense = pts.length > 30;
  pts.forEach((p, i) => {
    if (dense && i !== pts.length - 1 && !(i > 0 && p.variant !== pts[i - 1].variant)) return;
    g += markerSvg(markerKind(c, p.variant), coords[i][0].toFixed(1), coords[i][1].toFixed(1));
  });
  const [lx, ly] = coords[coords.length - 1];
  g += `<text class="endlab" x="${Math.min(lx, W - 4).toFixed(1)}" y="${(ly - 11).toFixed(1)}" text-anchor="${lx > W - 30 ? 'end' : 'middle'}">${fmtNum(pts[pts.length - 1].y)}</text>`;
  g += `<line class="xhair" data-x x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><circle class="hl" data-hl r="8" cx="0" cy="0" visibility="hidden"/>`;
  g += `<rect data-hit x="${m.l - 10}" y="0" width="${iw + 20}" height="${H}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">${g}</svg><div class="tip" hidden></div>`;
  // Legende (nur wenn mehr als eine Variante vorkommt)
  const kinds = [...new Set(pts.map(p => p.variant))];
  const leg = $(`[data-legend="${el.dataset.chart}"]`);
  if (leg) leg.innerHTML = kinds.length > 1 || (c.kind !== 'run' && kinds[0] !== 'normal')
    ? kinds.map(k => `<span>${legendMarker(markerKind(c, k))}${esc(seriesLabel(c, k))}</span>`).join('') : '';
  attachChartHover(el, W, pts.map((p, i) => ({ x: coords[i][0], y: coords[i][1], html: `<b>${fmtNum(p.y)} ${c.unit}</b><span>${esc(fmtDateMed(p.date))} · ${esc(seriesLabel(c, p.variant))}</span>` })), true);
}

function roundTopRect(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  if (h <= 0) return '';
  return `M${x} ${y + h}V${y + r}Q${x} ${y} ${x + r} ${y}H${x + w - r}Q${x + w} ${y} ${x + w} ${y + r}V${y + h}Z`;
}
function drawBarChart(el, W, bars, target) {
  const H = 176, m = { l: 30, r: 14, t: 22, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxV = Math.max(target, ...bars.map(b => b.v || 0), 1);
  const ymax = maxV + (maxV >= 5 ? 1 : 0.5);
  const step = maxV > 6 ? 2 : 1;
  const Y = v => m.t + ih - (v / ymax) * ih;
  const band = iw / bars.length, bw = Math.min(24, band * 0.62);
  let g = '';
  for (let v = 0; v <= maxV; v += step) {
    const y = Y(v).toFixed(1);
    g += `<line class="${v === 0 ? 'axis' : 'grid'}" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="tick" x="${m.l - 7}" y="${(+y + 4).toFixed(1)}" text-anchor="end">${v}</text>`;
  }
  const pts = [];
  bars.forEach((b, i) => {
    const cx = m.l + band * (i + 0.5);
    if (b.v) g += `<path class="barr" d="${roundTopRect(cx - bw / 2, Y(b.v), bw, Y(0) - Y(b.v), 4)}"/>`;
    g += `<text class="tick" x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" ${b.cur ? 'style="font-weight:700;fill:var(--text)"' : ''}>${b.label}</text>`;
    pts.push({ x: cx, y: Y(b.v || 0), html: b.v === null ? `<b>${b.label.replace('W', 'Woche ')}</b><span>noch nicht erreicht</span>` : `<b>${plural(b.v, 'Training', 'Trainings')}</b><span>${b.label.replace('W', 'Woche ')}${b.cur ? ' (aktuell)' : ''}</span>` });
  });
  const ty = Y(target).toFixed(1);
  g += `<line class="target" x1="${m.l}" x2="${W - m.r}" y1="${ty}" y2="${ty}"/><text class="tlab" x="${W - m.r}" y="${(+ty - 6).toFixed(1)}" text-anchor="end">Ziel ${target}</text>`;
  g += `<line class="xhair" data-x x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><circle class="hl" data-hl r="0" cx="0" cy="0" visibility="hidden"/>`;
  g += `<rect data-hit x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-hidden="true">${g}</svg><div class="tip" hidden></div>`;
  attachChartHover(el, W, pts, false);
}

function attachChartHover(el, W, pts, showHl) {
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
  const xh = svg.querySelector('[data-x]'), hl = svg.querySelector('[data-hl]');
  let hideT = null, cur = -1;
  const show = i => {
    cur = i;
    const p = pts[i];
    const k = el.clientWidth / W;
    xh.setAttribute('x1', p.x); xh.setAttribute('x2', p.x); xh.setAttribute('visibility', 'visible');
    if (showHl) { hl.setAttribute('cx', p.x); hl.setAttribute('cy', p.y); hl.setAttribute('visibility', 'visible'); }
    tip.innerHTML = p.html; tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const left = clamp(p.x * k, tw / 2 + 2, el.clientWidth - tw / 2 - 2);
    let top = p.y * k - th - 14;
    if (top < -8) top = p.y * k + 14;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  };
  const hide = () => { cur = -1; tip.hidden = true; xh.setAttribute('visibility', 'hidden'); hl.setAttribute('visibility', 'hidden'); };
  const nearest = e => {
    const r = svg.getBoundingClientRect();
    const sx = (e.clientX - r.left) * (W / r.width);
    let bi = 0, bd = Infinity;
    pts.forEach((p, i) => { const d = Math.abs(p.x - sx); if (d < bd) { bd = d; bi = i; } });
    return bi;
  };
  svg.addEventListener('pointermove', e => { clearTimeout(hideT); show(nearest(e)); });
  svg.addEventListener('pointerdown', e => { clearTimeout(hideT); show(nearest(e)); });
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
  svg.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { clearTimeout(hideT); hideT = setTimeout(hide, 2600); } });
  el.addEventListener('focus', () => show(pts.length - 1));
  el.addEventListener('blur', hide);
  el.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); show(clamp((cur < 0 ? pts.length - 1 : cur) + (e.key === 'ArrowLeft' ? -1 : 1), 0, pts.length - 1)); }
  });
}

/* ============================ 7. Geführtes Training ============================
   Zustand liegt komplett in data.activeWorkout und wird nach jedem Satz/Schritt
   gespeichert. Timer speichern nur Endzeitpunkte (endAt); die Restzeit wird bei
   jedem Tick aus Date.now() berechnet – Bildschirmsperre und Tab-Wechsel sind egal. */
const TIMED = new Set(['prep', 'work', 'switch', 'rest']);
const RING_C = 2 * Math.PI * 45;
const W = () => data.activeWorkout;

function buildSteps(kind, setsPerEx) {
  const steps = [];
  if (kind === 'full') {
    steps.push({ t: 'intro', s: 'warmup' });
    PLAN.warmup.forEach((_, i) => steps.push({ t: 'warm', s: 'warmup', i }));
    steps.push({ t: 'intro', s: 'strength' });
    PLAN.exercises.forEach(e => { for (let n = 1; n <= setsPerEx; n++) steps.push({ t: 'set', s: 'strength', ex: e.id, n, of: setsPerEx }); });
    steps.push({ t: 'run', s: 'run' });
    steps.push({ t: 'intro', s: 'cooldown' });
    PLAN.cooldown.forEach((_, i) => steps.push({ t: 'stretch', s: 'cooldown', i }));
  } else {
    steps.push({ t: 'run', s: 'run' });
  }
  steps.push({ t: 'finish', s: 'finish' });
  return steps;
}

function newWorkout(kind) {
  const info = planInfo();
  const week = info.effWeek;
  const phase = phaseForWeek(week);
  const w = {
    id: uid('s'), kind, startedAt: Date.now(), lastSavedAt: Date.now(),
    week, phaseId: phase.id, setsPerEx: phase.sets,
    steps: buildSteps(kind, phase.sets), idx: 0, st: { mode: 'ready' },
    ex: {}, warm: { done: [] }, cool: { done: [] }, run: null, skipped: [],
    endedEarly: false, endedAt: null, effort: null, note: '',
  };
  if (kind === 'full') {
    for (const e of PLAN.exercises) {
      const v = variantOf(e.id);
      w.ex[e.id] = { variant: v, goal: computeGoal(e.id, v, week), plannedSets: phase.sets, sets: [], dur: null };
    }
  }
  onEnterStep(w);
  return w;
}

function restFor(w, exId) { const ph = phaseById(w.phaseId); return ph.rest || EX[exId].rest; }
function stepParts(step) {
  if (step.t === 'warm') { const it = PLAN.warmup[step.i]; return it.parts ? it.parts.length : 1; }
  if (step.t === 'stretch') return PLAN.cooldown[step.i].sides ? 2 : 1;
  return 1;
}
function partLabel(step, part) {
  if (step.t === 'warm') { const it = PLAN.warmup[step.i]; return it.parts ? it.parts[part] : 'Los'; }
  if (step.t === 'stretch') return PLAN.cooldown[step.i].sides ? (part ? 'Zweite Seite' : 'Erste Seite') : 'Dehnen';
  return 'Halten';
}
function stepName(step, w) {
  if (step.t === 'warm') return PLAN.warmup[step.i].name;
  if (step.t === 'stretch') return PLAN.cooldown[step.i].name;
  if (step.t === 'set') return exDef(step.ex, w.ex[step.ex].variant).name;
  return '';
}
function stepLabel(w, step) {
  if (!step) return '';
  switch (step.t) {
    case 'intro': return PLAN.sections[step.s].name;
    case 'warm': return `Aufwärmen · ${PLAN.warmup[step.i].name}`;
    case 'set': return `${EX[step.ex].name} · Satz ${step.n} von ${step.of}${w.st.mode === 'rest' ? ' (Pause)' : ''}`;
    case 'run': return w.run && w.run.startedAt ? `Joggen · ${fmtClock(runElapsed(w.run, w.lastSavedAt || Date.now()))} von ${fmtClock(w.run.program.total)}` : 'Joggen';
    case 'stretch': return `Dehnen · ${PLAN.cooldown[step.i].name}`;
    default: return 'Zusammenfassung';
  }
}

function onEnterStep(w) {
  const s = w.steps[w.idx];
  if (s.t === 'run' && !w.run) w.run = newRun(w.week);
  if (s.t === 'finish' && !w.endedAt) w.endedAt = Date.now();
}
function ensureStepState(w, step) {
  if (step.t === 'set' && w.st.mode === 'ready') {
    const rec = w.ex[step.ex];
    const d = exDef(step.ex, rec.variant);
    if (d.type === 'time') { if (w.st.dur == null) w.st.dur = rec.dur || rec.goal.hi; }
    else if (w.st.val == null) w.st.val = prefillValue(w, step);
  }
  if (step.t === 'run' && !w.run) w.run = newRun(w.week);
}
function prefillValue(w, step) {
  const rec = w.ex[step.ex];
  const d = exDef(step.ex, rec.variant);
  const g = rec.goal;
  const lastVals = g.last || [];
  let v = lastVals[step.n - 1];
  if (v == null) { const cur = rec.sets.filter(x => x.variant === rec.variant); if (cur.length) v = cur[cur.length - 1].v; }

/* ---------------------------- Ticker & Timer ---------------------------- */

  const st = w.st;
  if (!TIMED.has(st.mode)) return;
  const rem = (st.endAt - now) / 1000;

  if (t && t.textContent !== txt) t.textContent = txt;

}

function timerEnded(w, step, now) {

    w.st = { mode: 'work', startAt: st.endAt, endAt: st.endAt + st.work * 1000, dur: st.work, work: st.work, part: st.part || 0 };
  } else if (st.mode === 'work') {

/* ---------------------------- Lauf-Modus ---------------------------- */
function newRun(week) {
  const program = jogProgram(week);

}

    const k = Math.round(at);

    if (say) c.says.push(say);
    if (opt.beep) c.beep = true;
    if (opt.tone) c.tone = opt.tone;
    if (opt.seg) c.seg = true;
    map.set(k, c);
  };
  if (p.mode === 'intervals') {
    let t = 0;
    const lastRun = p.segs.map(s => s.type).lastIndexOf('run');
    p.segs.forEach((s, i) => {
      if (i > 0) {
        add(t, s.type === 'run' ? (i === lastRun ? 'Laufen. Letztes Intervall' : 'Laufen') : 'Gehen', { tone: 'switch', seg: true });

      }
      t += s.sec;
    });
  }
  add(p.total / 2, 'Halbzeit');
  add(p.total - 60, 'Noch eine Minute');
  [3, 2, 1].forEach(k => add(p.total - k, null, { beep: true }));

}

  const set = (sel, txt) => { const e = $(sel); if (e && e.textContent !== txt) e.textContent = txt; };
  set('[data-t="run-el"]', fmtClock(el));
  set('[data-t="run-rem"]', fmtClock(Math.ceil(T - el)));
  const prog = $('[data-ring-prog]');
  if (r.program.mode === 'intervals') {
    set('[data-ring-time]', fmtClock(Math.ceil(s.rem)));
    if (prog) prog.style.strokeDashoffset = (RING_C * (1 - clamp(s.rem / s.seg.sec, 0, 1))).toFixed(2);
  } else {
    set('[data-ring-time]', fmtClock(el));
    set('[data-ring-sub]', `noch ${fmtClock(Math.ceil(T - el))}`);
    if (prog) prog.style.strokeDashoffset = (RING_C * (1 - clamp(el / T, 0, 1))).toFixed(2);
  }
  const fill = $('[data-t="run-fill"]');
  if (fill) fill.style.width = (clamp(1 - s.rem / s.seg.sec, 0, 1) * 100).toFixed(1) + '%';
  const pos = $('[data-t="run-pos"]');
  if (pos) pos.style.left = (clamp(el / T, 0, 1) * 100).toFixed(2) + '%';
}
function runStart() {
  const w = W(), r = w.run;
  unlockSignals();
  r.startedAt = Date.now(); r.fired = {}; r.pausedTotal = 0; r.pausedAt = null;
  ui.runSegIdx = 0; ui.lastRunSave = Date.now();
  Sound.go();
  Voice.say(r.program.mode === 'intervals' ? "Los geht's. Laufen." : `Los geht's. ${r.program.total / 60} Minuten locker laufen.`);
  Wake.on();
  w.lastSavedAt = Date.now();
  save(); renderWorkout();
}
function runPause() {
  const w = W(), r = w.run;
  if (!r || r.pausedAt || r.done) return;
  r.pausedAt = Date.now();
  Voice.say('Pausiert');
  save(); renderWorkout();
}
function runResume() {
  const w = W(), r = w.run;
  if (!r || !r.pausedAt) return;
  r.pausedTotal += Date.now() - r.pausedAt;
  r.pausedAt = null;
  Voice.say("Weiter geht's");
  save(); renderWorkout();
}
async function runEnd() {
  const w = W(), r = w.run;
  const el = runElapsed(r, Date.now());
  const ok = await confirmDialog('Lauf vorzeitig beenden?', `Die bisher gelaufene Zeit (${fmtClock(el)}) wird gespeichert.`, 'Lauf beenden', 'danger-solid');
  if (!ok || !W()) return;
  finishRun(w, true, Date.now());
}
function runContinue() { advance(W(), { announce: false }); }
async function runCancel() {
  const w = W();
  if (w.kind === 'run') {
    data.activeWorkout = null; ui.inWorkout = false;
    save(); stopWorkoutRuntime(); render();
  } else skipSection();
}

/* ---------------------------- Training: Ansichten ---------------------------- */
function renderWorkout() {
  const w = W();
  if (!w) { ui.inWorkout = false; render(); return; }
  document.body.classList.add('no-tabbar');
  const step = w.steps[w.idx];
  ensureStepState(w, step);
  const r = w.run;
  const modeKey = step.t === 'run' ? `run${r && r.startedAt ? 's' : ''}${r && r.done ? 'd' : ''}` : (w.st.mode === 'rest' ? 'rest' : 'x');
  const key = `wk-${w.idx}-${modeKey}`;
  const changed = key !== ui.lastViewKey;
  $('#app').innerHTML = `<div class="wk">${workoutHeader(w, step)}<div class="wk-body ${changed ? 'enter' : ''}">${stepBody(w, step)}</div></div>`;
  if (changed) window.scrollTo(0, 0);
  ui.lastViewKey = key;
  tick(true);
}

function workoutHeader(w, step) {
  const secs = [...new Set(w.steps.filter(s => s.s !== 'finish').map(s => s.s))];
  const bars = secs.map(sec => {
    const idxs = w.steps.map((s, i) => s.s === sec ? i : -1).filter(i => i >= 0);
    const done = idxs.filter(i => i < w.idx).length + (step.s === sec && step.t === 'run' && w.run && w.run.startedAt ? (w.run.done ? 1 : clamp(runElapsed(w.run, Date.now()) / w.run.program.total, 0, 1)) : 0);
    const frac = step.t === 'finish' ? 1 : clamp(done / idxs.length, 0, 1);
    return `<span title="${PLAN.sections[sec].name}"><i style="width:${(frac * 100).toFixed(1)}%"></i></span>`;
  }).join('');
  let sub = '';
  if (step.t === 'warm') sub = `${step.i + 1} von ${PLAN.warmup.length}`;
  else if (step.t === 'set') sub = `Übung ${PLAN.exercises.findIndex(e => e.id === step.ex) + 1} von ${PLAN.exercises.length}`;
  else if (step.t === 'stretch') sub = `${step.i + 1} von ${PLAN.cooldown.length}`;
  else if (step.t === 'intro') sub = PLAN.sections[step.s].approx;
  else if (step.t === 'run') sub = w.run ? `Woche ${w.run.program.week}` : '';
  else sub = 'Zusammenfassung';
  const title = step.t === 'finish' ? 'Geschafft' : PLAN.sections[step.s].name;
  return `<header class="wk-head">
      ${step.t === 'finish' ? '<span></span>' : `<button class="end" data-action="endWorkout">Beenden</button>`}
      <div class="ttl"><b>${esc(title)}</b><small>${esc(sub)}</small></div>
      <span class="clock" data-t="elapsed" aria-label="Dauer">0:00</span>
    </header>
    <div class="wk-prog" style="grid-template-columns:repeat(${secs.length},1fr)" aria-hidden="true">${bars}</div>`;
}

function stepBody(w, step) {
  switch (step.t) {
    case 'intro': return introBody(w, step);
    case 'warm': return warmBody(w, step);
    case 'set': return w.st.mode === 'rest' ? restBody(w, step) : setBody(w, step);
    case 'run': return runBody(w);
    case 'stretch': return stretchBody(w, step);
    default: return finishBody(w);
  }
}

function ringHtml({ cls = '', label = '', time = '', sub = '', frac = 1 } = {}) {
  return `<div class="ring ${cls}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="45"/>
    <circle class="prog" cx="50" cy="50" r="45" stroke-dasharray="${RING_C.toFixed(2)}" stroke-dashoffset="${(RING_C * (1 - frac)).toFixed(2)}" data-ring-prog/></svg>
    <div class="ring-c"><div class="ring-l">${label}</div><div class="ring-t" data-ring-time role="timer">${time}</div><div class="ring-s" data-ring-sub>${sub}</div></div></div>`;
}
function timedRing(w, step, readyDur) {
  const st = w.st;
  if (st.mode === 'ready') return ringHtml({ cls: 'idle', label: 'Bereit', time: fmtClock(readyDur), sub: 'Tippe auf Start' });
  const rem = Math.max(0, (st.endAt - Date.now()) / 1000);
  if (st.mode === 'prep') return ringHtml({ cls: 'prep', label: 'Bereit machen', time: String(Math.max(1, Math.ceil(rem))), sub: 'gleich geht’s los', frac: rem / st.dur });
  if (st.mode === 'switch') return ringHtml({ cls: 'calm', label: step.t === 'warm' ? 'Wechseln' : 'Seite wechseln', time: String(Math.max(1, Math.ceil(rem))), sub: esc(partLabel(step, st.part)), frac: rem / st.dur });
  const parts = stepParts(step);
  return ringHtml({ label: esc(partLabel(step, st.part || 0)), time: fmtClock(Math.ceil(rem)), sub: parts > 1 ? `${(st.part || 0) + 1} von ${parts}` : '', frac: rem / st.dur });
}
function timedActions(w, startLabel = 'Start', stopLabel = 'Fertig') {
  const m = w.st.mode;
  if (m === 'ready') return `<button class="btn btn-primary btn-xl btn-block" data-action="timerStart">${icon('play')} ${startLabel}</button>`;
  if (m === 'prep') return `<button class="btn btn-primary btn-xl btn-block" data-action="timerNow">Sofort starten</button><button class="btn btn-plain btn-block" data-action="timerCancel">Abbrechen</button>`;
  if (m === 'switch') return `<button class="btn btn-calm btn-xl btn-block" data-action="timerNow">Weiter</button>`;
  return `<button class="btn btn-secondary btn-xl btn-block" data-action="timerStop">${icon('stop')} ${stopLabel}</button>`;
}

function introBody(w, step) {
  const sec = PLAN.sections[step.s];
  const order = ['warmup', 'strength', 'run', 'cooldown'];
  let list = '', extra = '';
  if (step.s === 'warmup') list = PLAN.warmup.map((x, i) => `<li><span class="n">${i + 1}</span><span class="grow">${esc(x.name)}</span><span class="t">${esc(x.label)}</span></li>`).join('');
  if (step.s === 'strength') {
    const ph = phaseById(w.phaseId);
    extra = `<div class="note accent">${icon('info')}<span><strong>Phase ${ph.name} · Woche ${w.week}:</strong> ${esc(ph.rules.join(' · '))}</span></div>`;
    list = PLAN.exercises.map((e, i) => {
      const r = w.ex[e.id], d = exDef(e.id, r.variant);
      const g = d.type === 'max' ? (r.goal.best != null ? `max. · Best ${r.goal.best}` : 'max.') : goalText(r.goal, d).replace(' Wdh.', '').replace(' pro Bein', '/Bein').replace(' Sek.', ' s').replace(' halten', '');
      return `<li><span class="n">${i + 1}</span><span class="grow">${esc(e.name)}${r.variant !== 'normal' ? `<br><small class="faint">${LEVEL_LABEL[r.variant]}</small>` : ''}</span><span class="t">${w.setsPerEx} × ${esc(g)}</span></li>`;
    }).join('');
  }
  if (step.s === 'cooldown') list = PLAN.cooldown.map((c, i) => `<li><span class="n">${i + 1}</span><span class="grow">${esc(c.name)}</span><span class="t">${c.sides ? 'je Seite 30 s' : '30 s'}</span></li>`).join('');
  return `<div><div class="kicker">Abschnitt ${order.indexOf(step.s) + 1} von 4</div><h1 class="ex-name">${sec.name}</h1><p class="ex-sub">${sec.approx}</p></div>
    ${extra}<ol class="intro-list">${list}</ol>
    <div class="wk-actions">
      <button class="btn btn-primary btn-xl btn-block" data-action="introStart">${icon('play')} Los geht's</button>
      <button class="btn btn-plain btn-block" data-action="skipSection">${sec.name} überspringen</button>
    </div>`;
}

function skipRow(itemLabel, sectionLabel, itemAction = 'skipItem') {
  return `<div class="skip-row"><button class="btn btn-plain" data-action="${itemAction}">${icon('skip', 'ic-sm')} ${itemLabel} auslassen</button><button class="btn btn-plain" data-action="skipSection">${sectionLabel} überspringen</button></div>`;
}
function nextCard(label, name, sub) {
  return `<div class="next-card"><div class="grow"><div class="lbl">${label}</div><div class="nm">${esc(name)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>${icon('right')}</div>`;
}

function warmBody(w, step) {
  const item = PLAN.warmup[step.i];
  const next = PLAN.warmup[step.i + 1];
  const head = `<div><div class="kicker">Aufwärmen · ${step.i + 1} von ${PLAN.warmup.length}</div><h1 class="ex-name">${esc(item.name)}</h1><p class="ex-sub">${esc(item.label)}</p></div>`;
  let mid, actions;
  if (item.kind === 'time') {
    mid = timedRing(w, step, item.sec * (item.parts ? item.parts.length : 1));
    actions = timedActions(w, 'Start', 'Fertig');
  } else {
    mid = `<div class="card" style="text-align:center;padding:30px 18px"><div class="num" style="font-size:72px;line-height:1">${esc(item.label.replace(' Wdh.', ''))}</div><div class="unit-label">Wiederholungen · locker</div></div>`;
    actions = `<button class="btn btn-primary btn-xl btn-block" data-action="warmDone">${icon('check')} Erledigt</button>`;
  }
  const tip = item.tip ? `<div class="note">${icon('bulb')}<span>${esc(item.tip)}</span></div>` : '';
  const nx = next ? nextCard('Als Nächstes', next.name, next.label) : nextCard('Danach', 'Krafttraining', `${PLAN.exercises.length} Übungen · ${w.setsPerEx} Sätze`);
  return `${head}${mid}${tip}${nx}
    <div class="wk-actions">${actions}${w.st.mode === 'ready' ? skipRow('Übung', 'Aufwärmen') : ''}</div>`;
}

function stretchBody(w, step) {
  const item = PLAN.cooldown[step.i];
  const next = PLAN.cooldown[step.i + 1];
  const head = `<div><div class="kicker">Dehnen · ${step.i + 1} von ${PLAN.cooldown.length}</div><h1 class="ex-name">${esc(item.name)}</h1><p class="ex-sub">${esc(item.desc)}</p></div>`;
  const mid = timedRing(w, step, item.sec);
  const sideNote = item.sides ? `<div class="note calm">${icon('refresh')}<span>Je Seite 30 Sek. – der Seitenwechsel wird angesagt.</span></div>` : '';
  const nx = next ? nextCard('Als Nächstes', next.name, next.sides ? 'je Seite 30 Sek.' : '30 Sek.') : nextCard('Danach', 'Zusammenfassung', 'Einheit bewerten und speichern');
  return `${head}${mid}${sideNote}${nx}
    <div class="wk-actions">${timedActions(w, 'Start', 'Fertig')}${w.st.mode === 'ready' ? skipRow('Dehnung', 'Dehnen') : ''}</div>`;
}

function goalNotes(w, step, rec, d) {
  const g = rec.goal, notes = [];
  const unitS = d.type === 'time' ? 'Sek.' : 'Wdh.';
  if (d.type === 'max') {
    if (g.best != null) notes.push(['star', 'gold', `Bestwert: <strong>${g.best} Wdh.</strong> – schlag ihn!`]);
    else notes.push(['info', '', 'Erstes Mal mit dieser Variante: Finde deinen Startwert.']);
    if (g.last && g.last.length) notes.push(['clock', '', `Letztes Mal: ${g.last.join(' · ')}`]);
    notes.push(['info', 'calm', esc(PLAN.maxHint)]);
    if (g.best != null && d.hardAt && g.best >= d.hardAt && rec.variant !== 'hard') notes.push(['up', '', `Ab ${d.hardAt} sauberen Wdh. lohnt sich die schwerere Variante.`]);
  } else {
    if (g.reason === 'progress') notes.push(['up', '', `Letztes Mal alle Sätze geschafft – heute +${g.step} ${unitS}${rec.variant !== 'hard' ? ' oder die schwerere Variante' : ''}.`]);
    else if (g.allHit && rec.variant !== 'hard') notes.push(['up', '', 'Letztes Mal alle Sätze geschafft – probier die schwerere Variante.']);
    else if (g.reason === 'week') notes.push(['up', '', `${esc(phaseById(w.phaseId).name)} · Woche ${w.week}: etwas mehr als in der Grundlage.`]);
    if (g.last && g.last.length) notes.push(['clock', '', `Letztes Mal: ${g.last.map(v => fmtValShort(v, d)).join(' · ')}`]);
  }
  return notes.map(([ic, cls, html]) => `<p class="${cls}">${icon(ic, 'ic-sm')}<span>${html}</span></p>`).join('');
}

function setBody(w, step) {
  const rec = w.ex[step.ex];
  const d = exDef(step.ex, rec.variant);
  const exIdx = PLAN.exercises.findIndex(e => e.id === step.ex);
  const ph = phaseById(w.phaseId);
  const running = d.type === 'time' && w.st.mode !== 'ready';
  const dots = Array.from({ length: step.of }, (_, i) => `<i class="${i < step.n - 1 ? 'done' : i === step.n - 1 ? 'cur' : ''}"></i>`).join('');
  const head = `<div><div class="kicker">Krafttraining · Übung ${exIdx + 1} von ${PLAN.exercises.length}</div>
    <h1 class="ex-name">${esc(d.name)}</h1>
    <p class="ex-sub">Satz ${step.n} von ${step.of}${rec.variant !== 'normal' ? ` · ${LEVEL_LABEL[rec.variant]}` : ''}</p>
    <div class="set-dots" aria-hidden="true">${dots}</div></div>`;
  const goal = `<div class="card card-tight"><div class="goal"><span class="gl">Ziel heute</span><span class="gv">${esc(goalText(rec.goal, d))}</span></div>
    <div class="goal-notes">${goalNotes(w, step, rec, d)}</div></div>`;
  let input, actions;
  const isLast = !w.steps[w.idx + 1] || w.steps[w.idx + 1].t !== 'set';
  if (d.type === 'time') {
    input = timedRing(w, step, w.st.dur);
    if (w.st.mode === 'ready') input += `<div class="dur-adj"><button class="icon-btn" data-action="durAdj" data-d="-5" aria-label="5 Sekunden weniger">${icon('minus')}</button><span class="v">Dauer ${w.st.dur} Sek.</span><button class="icon-btn" data-action="durAdj" data-d="5" aria-label="5 Sekunden mehr">${icon('plus')}</button></div>`;
    actions = timedActions(w, 'Start', d.hold ? 'Stopp – Zeit speichern' : 'Stopp');
    if (w.st.mode === 'work' && d.hold) actions += `<p class="tiny faint" style="text-align:center">Früher aufhören ist okay – die gehaltene Zeit wird gespeichert.</p>`;
  } else {
    input = `<div><div class="stepper">
        <button class="step-btn" data-hold="-1" aria-label="Eine weniger" style="-webkit-touch-callout:none">${icon('minus')}</button>
        <input class="big-num" id="rep-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" value="${esc(w.st.val)}" data-input="repVal" aria-label="Wiederholungen">
        <button class="step-btn" data-hold="1" aria-label="Eine mehr" style="-webkit-touch-callout:none">${icon('plus')}</button>
      </div><div class="unit-label">${d.perLeg ? 'Wiederholungen pro Bein' : 'Wiederholungen'}</div></div>`;
    actions = `<button class="btn btn-primary btn-xl btn-block" data-action="logSet">${icon('check')} ${isLast ? 'Satz speichern & weiter' : 'Satz speichern'}</button>`;
  }
  if (w.st.mode === 'ready') actions += skipRow('Übung', 'Kraft', 'skipExercise');
  let tip = '';
  if (ph.hint === 'easy' && rec.variant === 'normal') tip = `<div class="note calm" style="margin-top:10px">${icon('bulb')}<span><strong>Grundlage:</strong> Technik zuerst. Klappt es noch nicht sauber, wähle „Leichter“: ${esc(EX[step.ex].variants.easy.name)}.</span></div>`;
  if (ph.hint === 'hard' && rec.variant !== 'hard') tip = `<div class="note accent" style="margin-top:10px">${icon('up')}<span><strong>Steigern:</strong> Bereit für mehr? „Schwerer“: ${esc(EX[step.ex].variants.hard.name)}.</span></div>`;
  const variant = `<div><div class="seg lg" role="group" aria-label="Variante">${LEVELS.map(l => `<button data-action="setVariant" data-v="${l.id}" aria-pressed="${rec.variant === l.id}">${l.label}</button>`).join('')}</div>
    <p class="variant-desc">${rec.variant !== 'normal' ? `<b>${esc(d.vname)}</b> – ${esc(d.vdesc)}` : 'Standardausführung'}</p>${tip}</div>`;
  const tech = `<details class="tech"><summary>${icon('bulb')} Technik-Hinweis ${icon('chev', 'chev')}</summary>
    <div class="body"><p>${esc(d.tech)}</p><p><b>Typische Fehler:</b> ${esc(d.mistakes)}</p>${d.type === 'max' ? `<p>${esc(PLAN.maxHint)}</p>` : ''}</div></details>`;
  if (running) return `${head}${input}<div class="wk-actions">${actions}</div>`;
  return `${head}${goal}${input}${variant}${tech}<div class="wk-actions">${actions}</div>`;
}

function restBody(w, step) {
  const rec = w.ex[step.ex];
  const last = rec.sets[rec.sets.length - 1];
  const dl = exDef(step.ex, last ? last.variant : rec.variant);
  const next = w.steps[w.idx + 1];
  const nRec = w.ex[next.ex], nd = exDef(next.ex, nRec.variant);
  const same = next.ex === step.ex;
  const rem = Math.max(0, (w.st.endAt - Date.now()) / 1000);
  const logged = last ? `<div class="logged">Satz ${step.n}:
      ${dl.type !== 'time' ? `<button class="icon-btn" data-action="adjLast" data-d="-1" aria-label="Korrigieren: eine weniger">${icon('minus', 'ic-sm')}</button>` : ''}
      <b data-logged>${last.v}</b>${dl.type === 'time' ? ' Sek.' : ' Wdh.'}
      ${dl.type !== 'time' ? `<button class="icon-btn" data-action="adjLast" data-d="1" aria-label="Korrigieren: eine mehr">${icon('plus', 'ic-sm')}</button>` : ''}</div>` : '';
  const nx = nextCard(same ? 'Als Nächstes' : 'Nächste Übung', `${nd.name}${nRec.variant !== 'normal' ? ' · ' + LEVEL_LABEL[nRec.variant] : ''}`, `Satz ${next.n} von ${next.of} · Ziel: ${goalText(nRec.goal, nd)}`);
  return `<div style="text-align:center"><div class="kicker calm">Pause</div><h1 class="title-2" style="margin-top:4px">Durchatmen</h1></div>
    ${ringHtml({ cls: 'calm', label: 'Pause', time: fmtClock(Math.ceil(rem)), sub: `${w.st.dur} Sek.`, frac: rem / w.st.dur })}
    ${logged}${nx}
    <div class="wk-actions"><div class="btn-row">
      <button class="btn btn-secondary" data-action="restAdd">+15 Sek.</button>
      <button class="btn btn-calm" data-action="restSkip">${icon('skip', 'ic-sm')} Überspringen</button>
    </div></div>`;
}

function runBody(w) {
  const r = w.run, p = r.program, guided = w.kind === 'full';
  const cur = r.startedAt && !r.done ? runSegAt(r, runElapsed(r, Date.now())) : null;
  const curSeg = r.done ? p.segs.length : cur ? cur.i : -1;
  const timeline = `<div class="timeline" aria-hidden="true">${p.segs.map((s, i) => `<i class="${s.type}${i < curSeg ? ' past' : ''}" style="flex:${s.sec}">${i === curSeg ? `<b data-t="run-fill" style="width:${(clamp(1 - cur.rem / s.sec, 0, 1) * 100).toFixed(1)}%"></b>` : ''}</i>`).join('')}<span class="pos" data-t="run-pos" style="left:${(clamp(runElapsed(r, Date.now()) / p.total, 0, 1) * 100).toFixed(2)}%"></span></div>`;
  const legend = p.mode === 'intervals' ? `<div class="timeline-legend"><span><i></i>Laufen</span><span><i class="walk"></i>Gehen</span></div>` : '';
  if (!r.startedAt) {
    return `<div><div class="kicker">${guided ? 'Joggen · direkt nach dem Krafttraining' : 'Lauf-Modus'}</div><h1 class="ex-name">${esc(p.label)}</h1><p class="ex-sub">Woche ${p.week} · ${esc(p.detail)}</p></div>
      <div class="card">${timeline}${legend}</div>
      <div style="display:grid;gap:8px">${PLAN.jogTips.map(t => `<div class="note">${icon('bulb')}<span>${esc(t)}</span></div>`).join('')}
        <div class="note calm">${icon('voice')}<span>${p.mode === 'intervals' ? 'Wechsel zwischen Laufen und Gehen werden mit Ton und Ansage gemeldet.' : 'Ansagen kommen zur Halbzeit und 1 Minute vor Schluss.'} Der Bildschirm bleibt an.</span></div></div>
      <div class="wk-actions"><button class="btn btn-primary btn-xl btn-block" data-action="runStart">${icon('play')} Lauf starten</button>
        <button class="btn btn-plain btn-block" data-action="runCancel">${guided ? 'Joggen überspringen' : 'Abbrechen'}</button></div>`;
  }
  if (r.done) {
    const lr = longestRun(w.id);
    const pr = lr && r.actualSec > lr + 5;
    return `<div style="text-align:center"><div class="kicker">${r.endedEarly ? 'Lauf beendet' : 'Lauf geschafft'}</div><h1 class="ex-name">${r.endedEarly ? 'Gut gemacht' : 'Stark gelaufen!'}</h1></div>
      ${ringHtml({ label: 'Gelaufen', time: fmtClock(r.actualSec), sub: `von ${fmtClock(p.total)}`, frac: clamp(r.actualSec / p.total, 0, 1) })}
      ${pr ? `<div class="pr">${icon('star')}<span class="grow"><b>Neuer Bestwert</b><small>Längster Lauf bisher: ${fmtMinDec(lr)} Min.</small></span></div>` : ''}
      <div class="wk-actions"><button class="btn btn-primary btn-xl btn-block" data-action="runContinue">${guided ? 'Weiter zum Abkühlen' : 'Weiter zur Zusammenfassung'} ${icon('right')}</button></div>`;
  }
  const el = runElapsed(r, Date.now());
  const s = runSegAt(r, el);
  const paused = !!r.pausedAt;
  const segType = s.seg.type;
  let ring;
  if (p.mode === 'intervals') {
    const runs = p.segs.filter(x => x.type === segType).length;
    const nth = p.segs.slice(0, s.i + 1).filter(x => x.type === segType).length;
    ring = ringHtml({ cls: paused ? 'idle' : segType === 'walk' ? 'calm' : '', label: `${segType === 'run' ? 'Laufen' : 'Gehen'} ${nth} von ${runs}`, time: fmtClock(Math.ceil(s.rem)), sub: 'im Intervall', frac: s.rem / s.seg.sec });
  } else {
    ring = ringHtml({ cls: paused ? 'idle' : '', label: 'Gesamtzeit', time: fmtClock(el), sub: `noch ${fmtClock(Math.ceil(p.total - el))}`, frac: el / p.total });
  }
  const label = paused ? 'Pausiert' : segType === 'run' ? 'Laufen' : 'Gehen';
  return `<div class="run-seg"><div class="lab ${paused ? 'paused' : segType}">${label}</div><div class="sub">${esc(p.label)}${p.mode === 'continuous' ? ' · locker' : ''}</div></div>
    ${ring}
    <div class="run-stats"><div><div class="k">Gesamtzeit</div><div class="v" data-t="run-el">${fmtClock(el)}</div></div><div><div class="k">Verbleibend</div><div class="v" data-t="run-rem">${fmtClock(Math.ceil(p.total - el))}</div></div></div>
    <div>${timeline}${legend}</div>
    <div class="wk-actions"><div class="btn-row">
      ${paused ? `<button class="btn btn-primary" data-action="runResume">${icon('play', 'ic-sm')} Fortsetzen</button>` : `<button class="btn btn-secondary" data-action="runPause">${icon('pause', 'ic-sm')} Pause</button>`}
      <button class="btn btn-danger" data-action="runEnd">${icon('stop', 'ic-sm')} Beenden</button>
    </div></div>`;
}

function finishBody(w) {
  const s = summarizeWorkout(w);
  const isRun = w.kind === 'run';
  const title = w.endedEarly ? 'Einheit beendet' : isRun ? 'Lauf geschafft!' : 'Training geschafft!';
  const stats = [`<div class="stat"><div class="k">Dauer</div><div class="v">${Math.round(s.dur / 60)}<small> Min.</small></div></div>`];
  if (!isRun) {
    stats.push(`<div class="stat"><div class="k">Wiederholungen</div><div class="v">${s.reps}</div></div>`);
    stats.push(`<div class="stat"><div class="k">Sätze</div><div class="v">${s.sets}</div></div>`);
  }
  stats.push(`<div class="stat"><div class="k">Joggen</div><div class="v">${s.runSec ? fmtMinDec(s.runSec) : '–'}<small>${s.runSec ? ' Min.' : ''}</small></div></div>`);
  const prs = s.prs.length ? `<h2 class="title-3">Neue Bestwerte</h2><div class="pr-list">${s.prs.map(p => {
    if (p.id === 'run') return `<div class="pr">${icon('star')}<span class="grow"><b>Längster Lauf: ${fmtMinDec(p.value)} Min.</b><small>vorher ${fmtMinDec(p.prev)} Min.</small></span></div>`;
    const d = exDef(p.id, p.variant);
    return `<div class="pr">${icon('star')}<span class="grow"><b>${esc(EX[p.id].name)}: ${esc(fmtVal(p.value, d))}</b><small>${LEVEL_LABEL[p.variant]} · vorher ${esc(fmtVal(p.prev, d))}</small></span></div>`;
  }).join('')}</div>` : '';
  const lines = s.recs.length ? `<div class="card card-tight"><div class="ex-lines">${s.recs.map(([id, r]) => {
    const vals = r.sets.map(x => fmtValShort(x.v, exDef(id, x.variant))).join(' · ');
    const vars = [...new Set(r.sets.map(x => x.variant))].map(v => LEVEL_LABEL[v]).join(' → ');
    return `<div><span class="l">${esc(EX[id].name)}<small>${vars}</small></span><span class="r">${vals}</span></div>`;
  }).join('')}</div></div>` : (isRun ? '' : `<div class="note">${icon('info')}<span>In dieser Einheit wurden keine Kraftsätze erfasst.</span></div>`);
  return `<div style="text-align:center" class="pop"><div class="kicker">${w.endedEarly ? 'Vorzeitig beendet' : 'Zusammenfassung'}</div><h1 class="ex-name" style="margin-top:4px">${title}</h1>
      <p class="ex-sub">${esc(fmtDateLong(dateStr(new Date(w.startedAt))))} · Woche ${w.week}</p></div>
    <div class="stats">${stats.join('')}</div>
    ${prs}${lines}
    <div><h2 class="title-3" style="margin-bottom:10px">Wie anstrengend war's?</h2>
      <div class="effort" role="group" aria-label="Anstrengung">${[1, 2, 3, 4, 5].map(i => `<button data-action="effort" data-e="${i}" aria-pressed="${w.effort === i}"><b>${i}</b><small>${EFFORT_LABELS[i]}</small></button>`).join('')}</div></div>
    <div><label for="note-input" class="title-3" style="display:block;margin-bottom:10px">Notiz <span class="faint small" style="font-weight:500">optional</span></label>
      <textarea id="note-input" data-input="note" placeholder="Wie lief's? Etwas gezwickt?" maxlength="2000">${esc(w.note || '')}</textarea></div>
    <div class="wk-actions static">
      <button class="btn btn-primary btn-xl btn-block" data-action="saveWorkout">${icon('check')} Speichern</button>
      <button class="btn btn-plain btn-block" style="color:var(--danger)" data-action="discardWorkout">Verwerfen</button>
    </div>`;
}

/* ============================ Aktionen & Ereignisse ============================ */
const ACTIONS = {
  tab: el => { ui.tab = el.dataset.tab; render(); },
  progTab: el => { ui.progTab = el.dataset.ptab; render(); },
  // Onboarding
  onbNext: () => { ui.onbStep = Math.min(2, ui.onbStep + 1); render(); },
  onbBack: () => { ui.onbStep = Math.max(0, ui.onbStep - 1); render(); },
  onbDay: el => { ui.onbSchedule[+el.dataset.day] = el.dataset.type; render(); },
  onbFinish: () => {
    unlockSignals();
    data.settings.startDate = isDateStr(ui.onbStart) ? ui.onbStart : todayStr();
    data.settings.schedule = ui.onbSchedule.slice();
    data.settings.onboarded = true;
    save();
    requestPersist();
    ui.tab = 'today';
    render();
  },
  // Start
  startWorkout: () => startWorkout('full'),
  startRun: () => startWorkout('run'),
  resumeWorkout: () => resumeWorkout(),
  discardActive: () => discardActive(false),
  // Training
  introStart: () => advance(W(), { announce: false }),
  skipSection, skipExercise, skipItem, warmDone,
  timerStart, timerNow, timerCancel, timerStop, durAdj,
  logSet, setVariant: el => setVariant(el.dataset.v), adjLast,
  restAdd, restSkip,
  runStart, runPause, runResume, runEnd, runContinue, runCancel,
  endWorkout, effort: setEffort, saveWorkout, discardWorkout,
  // Daten & Einstellungen
  export: () => exportData(),
  import: () => { const f = $('#import-file'); f.value = ''; f.click(); },
  setDay: el => { data.settings.schedule[+el.dataset.day] = el.dataset.type; save(); render(); },
  testSignals: () => {
    unlockSignals();
    const s = data.settings;
    if (!s.sound && !s.voice) { toast('Töne und Ansagen sind ausgeschaltet'); return; }
    Sound.tick(); setTimeout(() => Sound.tick(), 1000); setTimeout(() => Sound.go(), 2000);
    setTimeout(() => Voice.say('Pause vorbei. Nächste Übung: Liegestütze.'), 2600);
    if (!s.voice) toast('Sprachansagen sind ausgeschaltet');
  },
  snoozeBackup: () => { data.settings.backupSnoozeUntil = Date.now() + 7 * 864e5; save(); render(); },
  dismissInstall: () => { data.settings.installHintDismissed = true; save(); render(); },
  deleteSession: async el => {
    const s = data.sessions.find(x => x.id === el.dataset.id);
    if (!s) return;
    const ok = await confirmDialog('Einheit löschen?', `${s.type === 'run' ? 'Lauf' : 'Training'} vom ${fmtDateMed(s.date)} wird endgültig gelöscht.`, 'Löschen', 'danger-solid');
    if (!ok) return;
    data.sessions = data.sessions.filter(x => x.id !== s.id);
    save(); render(); toast('Einheit gelöscht');
  },
  continuePlan: () => { data.settings.afterPlan = 'continue'; save(); render(); toast('Weiter mit Phase Steigern'); },
  restartPlan: async () => {
    const ok = await confirmDialog('Plan neu starten?', 'Woche 1 beginnt heute. Dein Verlauf und deine Bestwerte bleiben erhalten.', 'Neu starten');
    if (!ok) return;
    data.settings.startDate = todayStr(); data.settings.afterPlan = null;
    save(); render(); toast('Neuer Plan gestartet – Woche 1');
  },
  resetAll: async () => {
    if (!(await confirmDialog('Alles zurücksetzen?', 'Alle Einheiten, Einstellungen und ein laufendes Training werden gelöscht.', 'Weiter', 'danger'))) return;
    if (!(await confirmDialog('Wirklich alles löschen?', 'Das kann nicht rückgängig gemacht werden. Tipp: Exportiere vorher ein Backup.', 'Endgültig löschen', 'danger-solid'))) return;
    stopWorkoutRuntime();
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    data = defaultData();
    Object.assign(ui, { tab: 'today', onbStep: 0, onbStart: null, onbSchedule: null, inWorkout: false, lastViewKey: null });
    save(); render(); toast('Alle Daten gelöscht');
  },
};
const CHANGES = {
  onbDate: el => { ui.onbStart = isDateStr(el.value) ? el.value : todayStr(); render(); },
  startDate: el => {
    if (!isDateStr(el.value)) { el.value = data.settings.startDate; return; }
    data.settings.startDate = el.value;
    if (planInfo().week <= PLAN.weeks) data.settings.afterPlan = null;
    save(); render(); toast('Startdatum geändert');
  },
  sound: el => { data.settings.sound = el.checked; save(); if (el.checked) { Sound.unlock(); Sound.go(); } },
  voice: el => { data.settings.voice = el.checked; save(); if (el.checked) { Voice.unlock(); Voice.say('Sprachansagen sind an.'); } },
};
const INPUTS = {
  repVal: el => { const w = W(); if (w) { const v = parseInt(el.value, 10); w.st.val = isFinite(v) ? clamp(v, 0, 999) : 0; } },
  note: noteInput,
};

document.addEventListener('click', e => {
  const hold = e.target.closest('[data-hold]');
  if (hold) { if (e.detail === 0) adjRep(Number(hold.dataset.hold)); return; } // Tastatur
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'rep-input') { e.preventDefault(); e.target.blur(); }
});

/* −/+ mit Gedrückthalten */
let holdT = null, holdI = null;
function stopHold() { clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null; }
document.addEventListener('pointerdown', e => {
  Sound.resume();
  const b = e.target.closest('[data-hold]');
  if (!b) return;
  e.preventDefault();
  stopHold();
  const d = Number(b.dataset.hold);
  adjRep(d);
  holdT = setTimeout(() => { holdI = setInterval(() => adjRep(d), 90); }, 450);
});
['pointerup', 'pointercancel', 'blur'].forEach(t => (t === 'blur' ? window : document).addEventListener(t, stopHold));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]')) e.preventDefault(); });

$('#import-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFromFile(f); });

/* Sichtbarkeit: Timer neu berechnen, Wake Lock erneut anfordern, Zustand sichern */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    Sound.resume();
    if (Wake.want) Wake.on();
    ui.cueKey = null;
    if (W() && ui.inWorkout) tick(false);
    else if (data.settings.onboarded && !ui.inWorkout && ui.tab === 'today') render(); // Datum kann sich geändert haben
  } else if (W()) {
    W().lastSavedAt = Date.now();
    save();
  }
});
window.addEventListener('pagehide', () => { if (W()) { W().lastSavedAt = Date.now(); save(); } });
let resizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (!ui.inWorkout && ui.tab === 'progress' && ui.progTab === 'charts') drawCharts(); }, 150);
});

/* ============================ 8. Start ============================ */
function init() {
  render();
  if (!data.settings.persistRequested) requestPersist(); // beim ersten Start dauerhaften Speicher anfragen
  if (data.activeWorkout) setTimeout(offerResume, 250);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service Worker:', err)));
  }
}
init();
</script>
</body>
</html>
