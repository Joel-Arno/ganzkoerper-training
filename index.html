<html lang="de">
<head>

<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f6" media="(prefers-color-scheme: light)">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* ============================================================
   Design-Tokens – dunkel als Standard, hell nach Systemeinstellung
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #0b0d10;
  --surface: #15181d;
  --surface-2: #1e2229;
  --surface-3: #2a2f38;
  --line: rgba(255,255,255,.08);
  --line-strong: rgba(255,255,255,.16);
  --text: #f3f5f7;
  --text-2: #a4abb6;
  --text-3: #727a86;
  --accent: #c6f24e;
  --accent-ink: #10150a;
  --accent-text: #c6f24e;
  --accent-soft: rgba(198,242,78,.13);
  --calm: #6cb6ff;
  --calm-ink: #06121f;
  --calm-soft: rgba(108,182,255,.14);
  --gold: #ffd25e;
  --gold-soft: rgba(255,210,94,.14);
  --danger: #ff6b6b;
  --danger-soft: rgba(255,107,107,.13);
  --backdrop: rgba(0,0,0,.6);
  --tabbar-bg: rgba(16,18,22,.82);
  --shadow: 0 10px 40px rgba(0,0,0,.45);
  --radius: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --tabbar-h: 60px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f2f3f6;
    --surface: #ffffff;
    --surface-2: #eceef2;
    --surface-3: #dfe2e8;
    --line: rgba(10,14,20,.08);
    --line-strong: rgba(10,14,20,.16);
    --text: #0d1014;
    --text-2: #555d69;
    --text-3: #868d98;
    --accent: #4c7d0c;
    --accent-ink: #ffffff;
    --accent-text: #3f6a08;
    --accent-soft: rgba(76,125,12,.11);
    --calm: #1f6fd1;
    --calm-ink: #ffffff;
    --calm-soft: rgba(31,111,209,.1);
    --gold: #a86f00;
    --gold-soft: rgba(201,140,0,.13);
    --danger: #d63a3a;
    --danger-soft: rgba(214,58,58,.1);
    --backdrop: rgba(10,14,20,.38);
    --tabbar-bg: rgba(248,249,251,.86);
    --shadow: 0 10px 40px rgba(10,14,20,.16);
  }
}

/* ============================== Basis ============================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 17px; line-height: 1.42;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  overscroll-behavior-y: none; overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
input, textarea, select { font: inherit; font-size: 17px; color: inherit; }
h1, h2, h3, p { margin: 0; }
ul, ol { margin: 0; padding: 0; }
a { color: var(--accent-text); }
svg.ic { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic-sm { width: 18px !important; height: 18px !important; }
.ic-lg { width: 28px !important; height: 28px !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

#app {
  width: 100%; max-width: 600px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 10px) max(16px, env(safe-area-inset-right)) calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px) max(16px, env(safe-area-inset-left));
}
body.no-tabbar #app { padding-bottom: 0; }

/* ============================== Typo ============================== */
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); }
.large-title { font-size: 34px; font-weight: 800; letter-spacing: -.025em; line-height: 1.12; }
.title-2 { font-size: 22px; font-weight: 750; letter-spacing: -.015em; line-height: 1.2; }
.title-3 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 15px; }
.tiny { font-size: 13px; }
.num { font-family: var(--font-num); font-weight: 700; letter-spacing: -.01em; }
.tnum { font-variant-numeric: tabular-nums; }
.page-head { padding: 10px 2px 18px; }
.page-head .eyebrow { margin-bottom: 4px; }
.section-title { font-size: 20px; font-weight: 750; letter-spacing: -.01em; margin: 28px 2px 12px; }
.stack > * + * { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* ============================== Karten ============================== */
.card { background: var(--surface); border-radius: var(--radius); padding: 18px; }
.card + .card { margin-top: 12px; }
.card-tight { padding: 14px 16px; }
.card.accent { background: linear-gradient(160deg, var(--accent-soft), transparent 70%), var(--surface); }
.card.gold { background: linear-gradient(160deg, var(--gold-soft), transparent 75%), var(--surface); }
.card.calm { background: linear-gradient(160deg, var(--calm-soft), transparent 75%), var(--surface); }
.card h2 { font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 14px; font-weight: 650;
  background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent-text); }
.chip.calm { background: var(--calm-soft); color: var(--calm); }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.danger { background: var(--danger-soft); color: var(--danger); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface-2);
  font-size: 15px; color: var(--text-2); line-height: 1.4; }
.note svg { margin-top: 1px; }
.note.warn { background: var(--gold-soft); color: var(--text); }
.note.warn svg { color: var(--gold); }
.note.accent { background: var(--accent-soft); color: var(--text); }
.note.accent svg { color: var(--accent-text); }
.note.calm { background: var(--calm-soft); color: var(--text); }
.note.calm svg { color: var(--calm); }
.note strong { color: var(--text); }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

/* ============================== Buttons ============================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px;
  border-radius: var(--radius-md); font-size: 17px; font-weight: 650; letter-spacing: -.005em; text-align: center;
  transition: transform .12s var(--ease), background-color .2s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn-block { display: flex; width: 100%; }
.btn-xl { min-height: 62px; font-size: 19px; border-radius: 18px; font-weight: 700; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-calm { background: var(--calm); color: var(--calm-ink); }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-ghost { background: transparent; color: var(--accent-text); min-height: 48px; padding: 0 12px; }
.btn-plain { background: transparent; color: var(--text-2); min-height: 48px; padding: 0 12px; font-weight: 600; }
.btn-danger { background: var(--danger-soft); color: var(--danger); }
.btn-danger-solid { background: var(--danger); color: #fff; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.skip-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.skip-row .btn { min-height: 48px; padding: 4px 6px; font-size: 14px; line-height: 1.2; }
.icon-btn { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; color: var(--text-2); }
.icon-btn:active { background: var(--surface-2); }
.link-btn { color: var(--accent-text); font-weight: 650; min-height: 48px; display: inline-flex; align-items: center; gap: 6px; }

/* ============================== Segmente / Toggles ============================== */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; padding: 3px; border-radius: 14px; background: var(--surface-2); }
.seg button { min-height: 44px; border-radius: 11px; font-size: 15px; font-weight: 650; color: var(--text-2); padding: 0 6px; transition: background-color .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.seg.accent button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg.lg button { min-height: 48px; }

.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--surface-3); transition: background-color .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .22s var(--ease); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ============================== Listen (Einstellungen) ============================== */
.group { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.group + .group { margin-top: 12px; }
.item { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 10px 16px; position: relative; width: 100%; text-align: left; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.item .grow small { display: block; color: var(--text-3); font-size: 14px; margin-top: 1px; }
button.item:active { background: var(--surface-2); }
.item .val { color: var(--text-2); font-size: 16px; }
.item.danger { color: var(--danger); font-weight: 600; }
.group-foot { font-size: 14px; color: var(--text-3); padding: 8px 18px 0; line-height: 1.4; }
.group-head { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-3); padding: 22px 18px 8px; }
input[type="date"] { appearance: none; -webkit-appearance: none; background: var(--surface-2); border: 0; border-radius: 10px; padding: 8px 12px;
  min-height: 40px; font-size: 17px; color: var(--text); font-family: var(--font); }
input[type="date"]::-webkit-date-and-time-value { text-align: right; }

/* Wochenplan-Editor */
.sched { display: grid; gap: 8px; }
.sched-row { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 8px; }
.sched-row .d { font-weight: 700; color: var(--text-2); font-size: 15px; }
.sched-row .seg button { font-size: 14px; }
.sched-row .seg button[data-type="train"][aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sched-row .seg button[data-type="active"][aria-pressed="true"] { background: var(--calm); color: var(--calm-ink); }

/* ============================== Tab-Leiste ============================== */
#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
  background: var(--tabbar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 1px solid var(--line); padding: 0 max(8px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-left)); }
#tabbar .tabs { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 600px; }
#tabbar button { height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--text-3); font-size: 11px; font-weight: 600; letter-spacing: .01em; }
#tabbar button svg { width: 25px; height: 25px; }
#tabbar button[aria-current="page"] { color: var(--accent-text); }
body.no-tabbar #tabbar { display: none; }

/* ============================== Heute ============================== */
.hero-week { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.hero-week > div { min-width: 0; }
.hero-week .big { white-space: nowrap; font-family: var(--font-num); font-size: 40px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
.hero-week .big small { font-size: 20px; color: var(--text-3); font-weight: 650; letter-spacing: 0; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: 14px; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .5s var(--ease); }
.phase-dots { display: grid; grid-template-columns: 2fr 3fr 3fr; gap: 4px; margin-top: 10px; }
.phase-dots span { font-size: 12px; font-weight: 650; color: var(--text-3); text-align: left; letter-spacing: .02em; }
.phase-dots span.on { color: var(--accent-text); }
.today-type { display: flex; align-items: center; gap: 14px; }
.today-type .badge { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
.today-type .badge.calm { background: var(--calm-soft); color: var(--calm); }
.today-type .badge.rest { background: var(--surface-2); color: var(--text-2); }
.today-type .badge svg { width: 26px; height: 26px; }
.agenda { display: grid; gap: 2px; margin: 16px 0 18px; }
.agenda li { list-style: none; display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 16px; }
.agenda li .n { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 13px; font-weight: 700; color: var(--text-2); flex: none; }
.agenda li .t { margin-left: auto; color: var(--text-3); font-size: 15px; white-space: nowrap; }
.week-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; }
.wday { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0 10px; border-radius: 14px; }
.wday .dn { font-size: 12px; font-weight: 650; color: var(--text-3); }
.wday .dd { font-size: 16px; font-weight: 700; font-family: var(--font-num); }
.wday .mk { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--text-3); }
.wday .mk svg { width: 16px; height: 16px; }
.wday .mk.plan-train { box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--text-2); }
.wday .mk.plan-active { color: var(--calm); }
.wday .mk.done { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.wday .mk.run { background: var(--calm-soft); color: var(--calm); box-shadow: none; }
.wday .mk.missed { box-shadow: inset 0 0 0 2px var(--danger-soft); color: var(--danger); }
.wday.today { background: var(--surface-2); }
.wday.today .dn { color: var(--accent-text); }
.streak { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 15px; color: var(--text-2); }
.streak svg { color: var(--gold); }
.streak strong { color: var(--text); }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--text-3); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.legend-row i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ============================== Training (geführt) ============================== */
.wk { display: flex; flex-direction: column; min-height: calc(100dvh - env(safe-area-inset-top) - 10px); }
.wk-head { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding: 4px 0 10px; background: var(--bg); }
.wk-head .end { justify-self: start; color: var(--danger); font-weight: 650; min-height: 44px; padding: 0 4px; font-size: 16px; }
.wk-head .ttl { text-align: center; line-height: 1.15; }
.wk-head .ttl b { display: block; font-size: 15px; font-weight: 700; }
.wk-head .ttl small { font-size: 13px; color: var(--text-3); font-weight: 600; }
.wk-head .clock { justify-self: end; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; color: var(--text-2); font-size: 16px; }
.wk-prog { display: grid; gap: 4px; margin-bottom: 4px; }
.wk-prog span { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.wk-prog span i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s var(--ease); }
.wk-body { flex: 1; display: flex; flex-direction: column; gap: 16px; padding-top: 14px; }
.wk-actions { position: sticky; bottom: 0; z-index: 8; margin-top: auto; padding: 14px 0 calc(env(safe-area-inset-bottom) + 14px);
  background: linear-gradient(to top, var(--bg) 78%, rgba(0,0,0,0)); display: grid; gap: 6px; }
.wk-actions .btn-row .btn { min-height: 58px; }
.wk-actions.static { position: static; background: none; padding-top: 4px; }
.kicker { font-size: 14px; font-weight: 650; color: var(--accent-text); letter-spacing: .02em; }
.kicker.calm { color: var(--calm); }
.ex-name { font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.1; }
.ex-sub { font-size: 17px; color: var(--text-2); margin-top: 6px; }
.set-dots { display: flex; gap: 6px; margin-top: 12px; }
.set-dots i { width: 28px; height: 6px; border-radius: 999px; background: var(--surface-3); }
.set-dots i.done { background: var(--accent); }
.set-dots i.cur { background: var(--text-2); }
.goal { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.goal .gl { font-size: 13px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
.goal .gv { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
.goal-notes { display: grid; gap: 6px; margin-top: 10px; }
.goal-notes p { font-size: 15px; color: var(--text-2); display: flex; gap: 8px; align-items: flex-start; }
.goal-notes p svg { margin-top: 2px; color: var(--accent-text); }
.goal-notes p.gold svg { color: var(--gold); }
.goal-notes p.calm svg { color: var(--calm); }

.stepper { display: grid; grid-template-columns: 76px 1fr 76px; align-items: center; gap: 10px; }
.step-btn { height: 76px; border-radius: 22px; background: var(--surface-2); display: grid; place-items: center; color: var(--text); }
.step-btn:active { background: var(--surface-3); transform: scale(.96); }
.step-btn svg { width: 30px; height: 30px; stroke-width: 2.6; }
.big-num { width: 100%; min-width: 0; text-align: center; background: transparent; border: 0; padding: 0; margin: 0; border-radius: 16px;
  font-family: var(--font-num); font-size: 92px; font-weight: 750; line-height: 1.05; letter-spacing: -.03em; color: var(--text);
  font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
.big-num::-webkit-outer-spin-button, .big-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.big-num:focus { outline: none; background: var(--surface-2); }
.unit-label { text-align: center; font-size: 17px; font-weight: 650; color: var(--text-2); margin-top: 2px; }

.ring { position: relative; width: min(74vw, 300px); aspect-ratio: 1 / 1; margin: 4px auto 0; }
.ring.sm { width: min(56vw, 230px); }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--surface-2); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring.calm .prog { stroke: var(--calm); }
.ring.idle .prog { stroke: var(--surface-3); }
.ring.prep .prog { stroke: var(--text-2); }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4px; }
.ring-t { font-family: var(--font-num); font-size: clamp(60px, 20vw, 88px); font-weight: 750; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.ring.sm .ring-t { font-size: clamp(44px, 14vw, 64px); }
.ring-l { font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }

/* Lauf */

.timeline { position: relative; display: flex; gap: 3px; height: 14px; margin-top: 4px; }

/* Abschluss */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border-radius: var(--radius-md); padding: 14px 16px; }

.effort { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.effort button { min-height: 64px; border-radius: 16px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.effort button b { font-family: var(--font-num); font-size: 22px; }
.effort button small { font-size: 11px; color: var(--text-3); font-weight: 600; }
.effort button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.effort button[aria-pressed="true"] small { color: var(--accent-ink); opacity: .8; }
textarea { width: 100%; min-height: 92px; resize: vertical; background: var(--surface-2); border: 0; border-radius: var(--radius-md); padding: 14px 16px; font-size: 17px; line-height: 1.4; color: var(--text); }
textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.pr-list { display: grid; gap: 8px; }
.pr { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--gold-soft); }
.pr svg { color: var(--gold); }
.pr .grow small { display: block; color: var(--text-2); font-size: 14px; }
.ex-lines { display: grid; gap: 0; }
.ex-lines > div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 15px; }
.ex-lines > div + div { border-top: 1px solid var(--line); }
.ex-lines .r { color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
.ex-lines .l small { display: block; color: var(--text-3); font-size: 13px; }

/* ============================== Fortschritt ============================== */
.chart-card { padding: 16px 16px 12px; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.chart-head .sub { font-size: 14px; color: var(--text-3); margin-top: 2px; }
.chart-head .kpi { text-align: right; }
.chart-head .kpi b { display: block; font-family: var(--font-num); font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; }

.chart { position: relative; margin-top: 10px; touch-action: pan-y; }

.chart .ylab { fill: var(--text-3); font-size: 11px; font-weight: 600; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .1; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .dot.hollow { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .ring-out { fill: none; stroke: var(--surface); stroke-width: 2; }
.chart .vmark { stroke: var(--text-3); stroke-width: 1; }
.chart .vlab { fill: var(--text-2); font-size: 11px; font-weight: 650; }
.chart .endlab { fill: var(--text); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart .barr { fill: var(--accent); }
.chart .barr.cur { fill: var(--accent); }
.chart .target { stroke: var(--text-2); stroke-width: 1; }
.chart .tlab { fill: var(--text-2); font-size: 11px; font-weight: 650; }
.chart .xhair { stroke: var(--text-2); stroke-width: 1; }
.chart .hl { fill: none; stroke: var(--text); stroke-width: 2; }
.tip { position: absolute; top: 0; pointer-events: none; background: var(--surface-3); color: var(--text); border-radius: 10px; padding: 7px 10px; font-size: 13px;
  line-height: 1.3; box-shadow: var(--shadow); white-space: nowrap; transform: translateX(-50%); z-index: 2; }
.tip b { font-size: 15px; display: block; }
.tip span { color: var(--text-2); display: block; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-2); margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend svg { width: 12px; height: 12px; }
.chart-empty { padding: 26px 8px; text-align: center; color: var(--text-3); font-size: 15px; }
details.table-view { margin-top: 6px; }
details.table-view summary { font-size: 14px; color: var(--text-3); min-height: 40px; display: flex; align-items: center; cursor: pointer; list-style: none; gap: 6px; }
details.table-view summary::-webkit-details-marker { display: none; }
details.table-view table { width: 100%; border-collapse: collapse; font-size: 14px; }
details.table-view th, details.table-view td { text-align: left; padding: 6px 4px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
details.table-view th { color: var(--text-3); font-weight: 600; }
details.table-view td:last-child, details.table-view th:last-child { text-align: right; }

.best-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 60px; }
.best-row + .best-row { border-top: 1px solid var(--line); }
.best-row .v { font-family: var(--font-num); font-size: 22px; font-weight: 750; text-align: right; white-space: nowrap; }
.best-row .v small { font-size: 14px; color: var(--text-2); font-weight: 600; font-family: var(--font); }
.best-row .grow small { display: block; font-size: 13px; color: var(--text-3); }

details.hist { background: var(--surface); border-radius: var(--radius-md); }
details.hist + details.hist { margin-top: 8px; }
details.hist summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; cursor: pointer; }
details.hist summary::-webkit-details-marker { display: none; }
details.hist summary .ic-b { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); flex: none; }
details.hist summary .ic-b.calm { background: var(--calm-soft); color: var(--calm); }
details.hist summary .grow b { display: block; font-size: 16px; }
details.hist summary .grow small { display: block; font-size: 14px; color: var(--text-3); }
details.hist summary .chev { color: var(--text-3); transition: transform .2s; }
details.hist[open] summary .chev { transform: rotate(180deg); }
details.hist .body { padding: 0 16px 14px; }
.effort-dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.effort-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-3); }
.effort-dots i.on { background: var(--accent); }

/* ============================== Plan ============================== */
.plan-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.plan-table td, .plan-table th { padding: 10px 0; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
.plan-table tr:first-child td, .plan-table tr:first-child th { border-top: 0; }
.plan-table th { color: var(--text-3); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
.plan-table td:last-child { text-align: right; color: var(--text-2); }
.plan-table td:first-child { white-space: nowrap; padding-right: 14px; }
.plan-table tr.cur td { color: var(--accent-text); font-weight: 650; }
.phase-card { border-left: 4px solid var(--surface-3); }
.phase-card.cur { border-left-color: var(--accent); }
.phase-card ul { margin-top: 8px; padding-left: 18px; color: var(--text-2); font-size: 15px; }
.phase-card li + li { margin-top: 3px; }
details.exd { background: var(--surface); border-radius: var(--radius-md); }
details.exd + details.exd { margin-top: 8px; }
details.exd summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 60px; cursor: pointer; }
details.exd summary::-webkit-details-marker { display: none; }
details.exd summary .grow b { display: block; }
details.exd summary .grow small { color: var(--text-3); font-size: 14px; }
details.exd summary .chev { color: var(--text-3); transition: transform .2s; }
details.exd[open] summary .chev { transform: rotate(180deg); }
details.exd .body { padding: 0 16px 16px; font-size: 15px; color: var(--text-2); display: grid; gap: 10px; }
details.exd .body b { color: var(--text); }
.var-grid { display: grid; gap: 6px; }
.var-grid div { display: grid; grid-template-columns: 84px 1fr; gap: 8px; }
.var-grid div span:first-child { font-weight: 650; color: var(--text-3); font-size: 14px; padding-top: 1px; }
.simple-list { display: grid; gap: 0; }
.simple-list li { list-style: none; display: flex; gap: 12px; padding: 10px 0; font-size: 15px; }
.simple-list li + li { border-top: 1px solid var(--line); }
.simple-list li .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 12px; font-weight: 700; color: var(--text-2); flex: none; }
.simple-list li .grow small { display: block; color: var(--text-3); font-size: 14px; }
.simple-list li .t { color: var(--text-3); text-align: right; max-width: 48%; margin-left: auto; }
.simple-list li > .grow + .t, .simple-list li > span:not(.n):not(.t) { min-width: 0; }

/* ============================== Onboarding ============================== */
.onb { min-height: calc(100dvh - env(safe-area-inset-top) - 10px); display: flex; flex-direction: column; padding-top: 24px; }
.onb .logo { width: 76px; height: 76px; border-radius: 20px; margin-bottom: 22px; display: block; }
.onb .dots { display: flex; gap: 6px; margin-bottom: 26px; }
.onb .dots i { width: 22px; height: 5px; border-radius: 999px; background: var(--surface-3); }
.onb .dots i.on { background: var(--accent); }
.onb .feat { display: grid; gap: 16px; margin: 28px 0; }
.onb .feat li { list-style: none; display: flex; gap: 14px; align-items: flex-start; }
.onb .feat li .b { width: 42px; height: 42px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; flex: none; }
.onb .feat li b { display: block; }
.onb .feat li small { color: var(--text-2); font-size: 15px; display: block; }
.onb-actions { margin-top: auto; padding: 18px 0 calc(env(safe-area-inset-bottom) + 18px); display: grid; gap: 8px; }
.date-field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* ============================== Dialog / Toast ============================== */
#modal-root { position: fixed; inset: 0; z-index: 100; display: none; }
#modal-root.open { display: block; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--backdrop); animation: fade .2s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 600px; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 22px max(20px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 18px) max(20px, env(safe-area-inset-left));
  box-shadow: var(--shadow); animation: sheet-up .3s var(--ease) both; max-height: 88dvh; overflow-y: auto; }
.sheet h2 { font-size: 21px; font-weight: 750; letter-spacing: -.01em; }
.sheet p { color: var(--text-2); margin-top: 8px; font-size: 16px; }
.sheet .sheet-actions { display: grid; gap: 8px; margin-top: 20px; }
#toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px); z-index: 120; transform: translate(-50%, 20px);
  background: var(--surface-3); color: var(--text); padding: 12px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s var(--ease); max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
body.no-tabbar #toast { bottom: calc(env(safe-area-inset-bottom) + 96px); }

/* ============================== Animation ============================== */
.enter { animation: enter .32s var(--ease) both; }
.pop { animation: pop .45s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.92); opacity: 0; } 60% { transform: scale(1.02); opacity: 1; } 100% { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media (min-width: 640px) { .ring { width: 300px; } }
</style>

<div id="app" aria-live="off"></div>

<script>
'use strict';
/* ==========================================================================
   Formkurve – Ganzkörper-Training
   Eine Datei, kein Framework. Aufbau:
     1. Konstanten & Trainingsplan (PLAN)
     2. Hilfsfunktionen
     3. Speicher (Laden, Speichern, Migration, Export/Import)
     4. Plan-Logik (Woche, Phase, Ziele, Bestwerte, Serie)

     6. Oberfläche (Icons, Dialoge, Ansichten)
     7. Geführtes Training & Lauf-Modus (Zustandsmaschine + Timer)
     8. Start
   ========================================================================== */

const APP_NAME = 'Formkurve';
const APP_VERSION = '1.0.0';
const STORAGE_KEY = 'gkt.v1';          // versionierter Speicher-Schlüssel

const PREP_SEC = 5;                     // Vorlauf vor Zeit-Übungen
const SWITCH_SEC = 5;                   // Zeit zum Seitenwechsel beim Dehnen

/* ============================ 1. Trainingsplan ============================ */
const PLAN = {
  weeks: 8,

    train:  { label: 'Training + Joggen', short: 'Training' },

  sections: {

  warmup: [

    { id: 'hips', name: 'Hüftkreisen', kind: 'time', sec: 30, label: '30 Sek.', halfCue: 'Richtung wechseln', tip: 'Nach der Hälfte die Richtung wechseln.' },
    { id: 'squats', name: 'Lockere Kniebeugen', kind: 'reps', label: '10 Wdh.' },
    { id: 'lunges', name: 'Ausfallschritte im Wechsel', kind: 'reps', label: '10 Wdh.' },
    { id: 'kneepush', name: 'Liegestütze auf den Knien', kind: 'reps', label: '5–8 Wdh.' },
    { id: 'hang', name: 'An der Klimmzugstange hängen', kind: 'time', sec: 20, label: '20 Sek.' },
  ],
  exercises: [
    { id: 'squat', name: 'Kniebeugen', type: 'reps', lo: 15, hi: 20, rest: 60,
      tech: 'Füße schulterbreit, Fußspitzen leicht nach außen. Po nach hinten-unten, bis die Oberschenkel etwa waagerecht sind, Brust bleibt oben.',
      mistakes: 'Knie fallen nach innen, Fersen heben ab.',
      variants: {
        easy: { name: 'Auf einen Stuhl absetzen', desc: 'Kniebeuge, bis der Po kurz einen Stuhl berührt – dann wieder hoch.' },

/* ============================ 2. Hilfsfunktionen ============================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad2 = n => String(n).padStart(2, '0');
const sum = arr => arr.reduce((a, b) => a + b, 0);
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid(p = 'id') { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

const DAY_NAMES = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const DAY_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];

function dateStr(d = new Date()) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
const todayStr = () => dateStr(new Date());
function isDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function dayNum(s) { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStr(d); }
function weekdayIdx(s) { return (parseDate(s).getDay() + 6) % 7; } // Montag = 0
function mondayOf(s) { return addDays(s, -weekdayIdx(s)); }
function fmtDateLong(s) { const d = parseDate(s); return `${DAY_NAMES[weekdayIdx(s)]}, ${d.getDate()}. ${MONTHS[d.getMonth()]}`; }
function fmtDateMed(s) { const d = parseDate(s); return `${DAY_SHORT[weekdayIdx(s)]}., ${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()}`; }
function fmtDateShort(s) { const d = parseDate(s); return `${d.getDate()}.${d.getMonth() + 1}.`; }
function fmtTimeOfDay(ms) { const d = new Date(ms); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`;
}
function fmtMinutes(sec) {
  const m = Math.round(sec / 60);
  if (m < 60) return `${m} Min.`;
  return `${Math.floor(m / 60)} Std. ${m % 60} Min.`;
}
function fmtMinDec(sec) { const m = sec / 60; return (Math.round(m * 10) / 10).toString().replace('.', ','); }
function plural(n, one, many) { return `${n} ${n === 1 ? one : many}`; }
function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function isStandalone() { return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches; }

/* ============================ 3. Speicher ============================ */
function defaultSettings() {
  return {
    onboarded: false,
    startDate: todayStr(),
    schedule: PLAN.defaultSchedule.slice(),
    sound: true,
    voice: true,
    variants: {},             // gemerkte Variante je Übung: { squat: 'easy', … }
    afterPlan: null,          // null | 'continue' (nach Woche 8 mit Steigern weitermachen)
    lastBackupAt: null,
    backupSnoozeUntil: null,
    installHintDismissed: false,
    persistRequested: false,
    createdAt: Date.now(),
  };
}
function defaultData() {
  return { version: SCHEMA_VERSION, settings: defaultSettings(), sessions: [], activeWorkout: null };
}

/* Migrationen: Schlüssel = Zielversion. Beispiel für später:
   2: d => { d.settings.neuesFeld = …; return d; }                                */
const MIGRATIONS = {};

function migrate(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error('Keine gültigen Daten.');
  if (typeof d.version !== 'number') d.version = 1;
  if (d.version > SCHEMA_VERSION) throw new Error('Die Daten stammen aus einer neueren App-Version.');
  while (d.version < SCHEMA_VERSION) {
    const step = MIGRATIONS[d.version + 1];
    if (!step) throw new Error('Keine Migration für Version ' + (d.version + 1));
    d = step(d);
    d.version += 1;
  }
  return normalize(d);
}

function normalize(d) {
  const base = defaultSettings();
  const s = Object.assign(base, (d.settings && typeof d.settings === 'object') ? d.settings : {});
  if (!isDateStr(s.startDate)) s.startDate = todayStr();
  if (!Array.isArray(s.schedule) || s.schedule.length !== 7 || !s.schedule.every(t => PLAN.dayTypes[t])) s.schedule = PLAN.defaultSchedule.slice();
  if (!s.variants || typeof s.variants !== 'object') s.variants = {};
  s.sound = s.sound !== false;
  s.voice = s.voice !== false;
  const sessions = Array.isArray(d.sessions) ? d.sessions.filter(x => x && typeof x === 'object' && x.id && typeof x.startedAt === 'number') : [];
  sessions.forEach(x => {
    if (!isDateStr(x.date)) x.date = dateStr(new Date(x.startedAt));
    if (!Array.isArray(x.exercises)) x.exercises = [];
    x.exercises = x.exercises.filter(e => e && EX[e.id] && Array.isArray(e.sets));
    x.exercises.forEach(e => { e.sets = e.sets.filter(st => st && typeof st.v === 'number' && isFinite(st.v)); e.sets.forEach(st => { if (!LEVEL_LABEL[st.variant]) st.variant = 'normal'; }); });
    if (x.type !== 'run') x.type = 'full';
  });
  sessions.sort((a, b) => a.startedAt - b.startedAt);
  const aw = d.activeWorkout && typeof d.activeWorkout === 'object' && Array.isArray(d.activeWorkout.steps) ? d.activeWorkout : null;
  return { version: SCHEMA_VERSION, settings: s, sessions, activeWorkout: aw };
}

function loadData() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { /* privat / blockiert */ }
  if (!raw) {
    for (const k of LEGACY_KEYS) {
      try { const r = localStorage.getItem(k); if (r) { raw = r; break; } } catch (e) {}
    }
  }
  if (!raw) return defaultData();
  try {
    return migrate(JSON.parse(raw));
  } catch (e) {
    // Beschädigte Daten nicht stillschweigend verwerfen: Kopie sichern.
    try { localStorage.setItem(STORAGE_KEY + '.defekt.' + Date.now(), raw); } catch (_) {}
    console.warn('Daten konnten nicht geladen werden:', e);
    return defaultData();
  }
}

let data = loadData();
let saveFailedShown = false;
function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    saveFailedShown = false;
    return true;
  } catch (e) {
    if (!saveFailedShown) { saveFailedShown = true; toast('Speichern fehlgeschlagen – bitte ein Backup exportieren.'); }
    return false;
  }
}

async function requestPersist() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      const already = navigator.storage.persisted ? await navigator.storage.persisted() : false;
      if (!already) await navigator.storage.persist();
    }
  } catch (e) {}
  if (!data.settings.persistRequested) { data.settings.persistRequested = true; save(); }
}

function backupFileName() { return `formkurve-backup-${todayStr()}.json`; }
async function exportData() {
  const payload = Object.assign({ app: APP_NAME, appVersion: APP_VERSION, exportedAt: new Date().toISOString() }, data);
  const json = JSON.stringify(payload, null, 2);
  const name = backupFileName();
  let file = null;
  try { file = new File([json], name, { type: 'application/json' }); } catch (e) {}
  if (file && navigator.canShare && navigator.share) {
    try {
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Formkurve-Backup' });
        markBackup();
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // Nutzer hat abgebrochen
    }
  }
  const blob = file || new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  markBackup();
}
function markBackup() {
  data.settings.lastBackupAt = Date.now();
  save();
  toast('Backup exportiert');
  if (ui.tab === 'settings' || ui.tab === 'today') render();
}

async function importFromFile(file) {
  let parsed;
  try {
    const text = await file.text();
    parsed = JSON.parse(text);
  } catch (e) {
    return dialog({ title: 'Import fehlgeschlagen', text: 'Die Datei ist keine gültige JSON-Datei.', actions: [{ label: 'OK', value: true, kind: 'primary' }] });
  }
  let next;
  try {
    if (!parsed || (!Array.isArray(parsed.sessions) && !parsed.settings)) throw new Error('Das ist kein Formkurve-Backup.');
    delete parsed.app; delete parsed.appVersion; delete parsed.exportedAt;
    next = migrate(parsed);
    next.activeWorkout = null;
    next.settings.onboarded = true;
  } catch (e) {
    return dialog({ title: 'Import fehlgeschlagen', text: e.message || 'Unbekanntes Format.', actions: [{ label: 'OK', value: true, kind: 'primary' }] });
  }
  const ok = await dialog({
    title: 'Daten überschreiben?',
    text: `Der Import ersetzt alle aktuellen Daten (${plural(data.sessions.length, 'Einheit', 'Einheiten')}) durch das Backup (${plural(next.sessions.length, 'Einheit', 'Einheiten')}, Startdatum ${fmtDateMed(next.settings.startDate)}). Das kann nicht rückgängig gemacht werden.`,
    actions: [{ label: 'Importieren und überschreiben', value: true, kind: 'danger-solid' }, { label: 'Abbrechen', value: false }],
  });
  if (!ok) return;
  stopWorkoutRuntime();
  data = next;
  save();
  ui.inWorkout = false;
  render();
  toast('Backup importiert');
}

/* ============================ 4. Plan-Logik ============================ */
function phaseForWeek(w) { return w <= 2 ? PLAN.phases[0] : w <= 5 ? PLAN.phases[1] : PLAN.phases[2]; }
function phaseById(id) { return PLAN.phases.find(p => p.id === id) || PLAN.phases[0]; }

function planInfo(today = todayStr()) {
  const s = data.settings;
  const diff = dayNum(today) - dayNum(s.startDate);
  if (diff < 0) {
    return { before: true, daysUntil: -diff, week: 0, effWeek: 1, phase: PLAN.phases[0], progress: 0, done: false, cont: false };
  }
  const week = Math.floor(diff / 7) + 1;
  const done = week > PLAN.weeks;
  const cont = done && s.afterPlan === 'continue';
  const effWeek = done && !cont ? PLAN.weeks : week;
  return { before: false, diff, week, effWeek, phase: phaseForWeek(effWeek), progress: Math.min(1, (diff + 1) / (PLAN.weeks * 7)), done, cont, dayInWeek: (diff % 7) + 1 };
}

/* Woche 1–2: +0, Aufbau 3–5: +1/Woche, Steigern 6+: Niveau von Woche 5 halten. */
function weeklyBonus(week) { return week <= 2 ? 0 : week <= 5 ? week - 2 : 3; }

function scheduleFor(dateS) { return data.settings.schedule[weekdayIdx(dateS)]; }
function trainingDayCount() { return data.settings.schedule.filter(t => t === 'train').length; }
function scheduleIssues(sch) {
  const issues = [];
  for (let i = 0; i < 7; i++) if (sch[i] === 'train' && sch[(i + 1) % 7] === 'train') issues.push([i, (i + 1) % 7]);
  return issues;
}
function scheduleWarning(sch) {
  if (!sch.includes('train')) return 'Wähle mindestens einen Trainingstag.';
  const iss = scheduleIssues(sch);
  if (!iss.length) return null;
  const pairs = iss.map(([a, b]) => `${DAY_SHORT[a]} & ${DAY_SHORT[b]}`).join(', ');
  return `Zwischen zwei Trainingstagen sollte immer mindestens ein Pausentag liegen. Direkt hintereinander: ${pairs}.`;
}

function jogProgram(week) {
  const w = clamp(week || 1, 1, PLAN.weeks);
  const p = PLAN.jogging[w];
  if (p.type === 'intervals') {
    const segs = [];
    for (let i = 0; i < p.reps; i++) { segs.push({ type: 'run', sec: p.run * 60 }); segs.push({ type: 'walk', sec: p.walk * 60 }); }
    const total = sum(segs.map(s => s.sec));
    return { week: w, mode: 'intervals', segs, total, label: `${total / 60} Min. Intervalle`, detail: `${p.reps} × (${p.run} Min. laufen, ${p.walk} Min. gehen)` };
  }
  return { week: w, mode: 'continuous', segs: [{ type: 'run', sec: p.min * 60 }], total: p.min * 60, label: `${p.min} Min. am Stück`, detail: 'Lockeres Tempo, ohne Gehpausen' };
}
function jogLabel(week) { const p = jogProgram(week); return p.mode === 'intervals' ? `${p.label}: ${p.detail}` : p.label; }

/* ---- Übungsdefinition inkl. Variante ---- */
function exDef(id, variant = 'normal') {
  const b = EX[id];
  const v = (variant !== 'normal' && b.variants[variant]) || {};
  return {
    ...b, variant,
    type: v.type || b.type,
    lo: v.lo ?? b.lo, hi: v.hi ?? b.hi,
    hold: v.hold ?? b.hold,
    vname: variant === 'normal' ? b.name : v.name,
    vdesc: variant === 'normal' ? 'Die Standardausführung.' : v.desc,
  };
}
function unitOf(def) { return def.type === 'time' ? 'Sek.' : 'Wdh.'; }
function fmtVal(v, def) { return def.type === 'time' ? `${v} Sek.` : `${v} Wdh.` + (def.perLeg ? ' pro Bein' : ''); }
function fmtValShort(v, def) { return def.type === 'time' ? `${v} s` : `${v}`; }
function goalText(goal, def) {
  if (def.type === 'max') return 'So viele wie sauber möglich';
  const range = goal.lo === goal.hi ? `${goal.hi}` : `${goal.lo}–${goal.hi}`;
  if (def.type === 'time') return `${range} Sek.` + (def.hold ? ' halten' : '');
  return `${range} Wdh.` + (def.perLeg ? ' pro Bein' : '');
}
function variantOf(exId) { const v = data.settings.variants[exId]; return LEVEL_LABEL[v] ? v : 'normal'; }

/* ---- Verlauf je Übung ---- */
function exRecords(exId) {
  const out = [];
  for (const s of data.sessions) for (const e of s.exercises || []) if (e.id === exId) out.push({ ...e, date: s.date, startedAt: s.startedAt, sid: s.id });
  return out;
}
function lastRecordFor(exId, variant) {
  const recs = exRecords(exId).filter(r => r.sets.some(x => x.variant === variant));
  return recs.length ? recs[recs.length - 1] : null;
}
function bestFor(exId, variant) {
  let best = null, date = null;
  for (const r of exRecords(exId)) for (const x of r.sets) if (x.variant === variant && (best === null || x.v > best)) { best = x.v; date = r.date; }
  return best === null ? null : { v: best, date };
}

/* ---- Ziel für eine Übung berechnen ----
   Zeit/Wiederholung: Plan-Ziel (Basis + Wochen-Bonus im Aufbau) – und Steigerungsregel:
   alle Sätze ≥ obere Zielzahl beim letzten Mal ⇒ +1–2 Wdh. bzw. +5–10 Sek.
   Max-Übungen: Bestwert als Ziel zum Schlagen.                                       */
function computeGoal(exId, variant, week) {
  const d = exDef(exId, variant);
  const last = lastRecordFor(exId, variant);
  const lastVals = last ? last.sets.filter(x => x.variant === variant).map(x => x.v) : null;
  if (d.type === 'max') {
    const best = bestFor(exId, variant);
    return { type: 'max', best: best ? best.v : null, last: lastVals };
  }
  const small = d.type === 'time' ? 5 : 1;
  const k = variant === 'hard' ? 0 : weeklyBonus(week);
  let goal = { type: d.type, lo: d.lo + k * small, hi: d.hi + k * small, reason: k > 0 ? 'week' : null, allHit: false, last: lastVals };
  if (last && last.goal && typeof last.goal.hi === 'number' && last.goal.type === d.type) {
    const planned = last.plannedSets || lastVals.length;
    const allHit = lastVals.length > 0 && lastVals.length >= planned && lastVals.every(v => v >= last.goal.hi);
    const big = d.type === 'time' ? (last.goal.hi >= 60 ? 10 : 5) : (last.goal.hi >= 12 ? 2 : 1);
    const cand = allHit ? { lo: last.goal.lo + big, hi: last.goal.hi + big } : { lo: last.goal.lo, hi: last.goal.hi };
    if (cand.hi > goal.hi) goal = { type: d.type, lo: cand.lo, hi: cand.hi, reason: allHit ? 'progress' : 'keep', step: big, allHit, last: lastVals };
    else goal.allHit = allHit;
  }
  return goal;
}

/* ---- Bestwerte, Rekorde ---- */
function sessionBest(sess, exId) {
  const e = (sess.exercises || []).find(x => x.id === exId);
  if (!e || !e.sets.length) return null;
  let b = e.sets[0];
  for (const x of e.sets) if (x.v > b.v) b = x;
  return b;
}
function longestRun(excludeId) {
  let best = null;
  for (const s of data.sessions) if (s.id !== excludeId && s.run && s.run.actualSec > 0 && (best === null || s.run.actualSec > best)) best = s.run.actualSec;
  return best;
}

/* ---- Wochen-Serie ---- */
function fullSessionsBetween(fromS, toS) {
  const a = dayNum(fromS), b = dayNum(toS);
  return data.sessions.filter(s => s.type === 'full' && dayNum(s.date) >= a && dayNum(s.date) <= b);
}
function requiredInRange(fromS, toS) {
  let n = 0;
  const start = dayNum(data.settings.startDate);
  for (let d = fromS; dayNum(d) <= dayNum(toS); d = addDays(d, 1)) if (dayNum(d) >= start && scheduleFor(d) === 'train') n++;
  return n;
}
function streakInfo() {
  const today = todayStr();
  const mon = mondayOf(today);
  const curReq = requiredInRange(mon, addDays(mon, 6));
  const curDone = fullSessionsBetween(mon, addDays(mon, 6)).length;
  let streak = curReq > 0 && curDone >= curReq ? 1 : 0;
  const startMon = mondayOf(data.settings.startDate);
  for (let w = addDays(mon, -7); dayNum(w) >= dayNum(startMon); w = addDays(w, -7)) {
    const req = requiredInRange(w, addDays(w, 6));
    if (req === 0) continue;
    if (fullSessionsBetween(w, addDays(w, 6)).length >= req) streak++;
    else break;
  }
  return { streak, curReq, curDone, weekTarget: trainingDayCount() };
}

const Sound = {
  ctx: null,
  unlock() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!this.ctx) this.ctx = new AC();
      if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
      // iOS: einen stillen Puffer im Tipp-Ereignis abspielen, um Audio freizuschalten
      const buf = this.ctx.createBuffer(1, 1, 22050);
      const src = this.ctx.createBufferSource();
      src.buffer = buf; src.connect(this.ctx.destination); src.start(0);
    } catch (e) {}
  },
  resume() { try { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); } catch (e) {} },
  tone(freq, dur = 0.15, { at = 0, vol = 0.32, type = 'sine' } = {}) {
    if (!data.settings.sound || !this.ctx) return;
    try {
      const c = this.ctx, t0 = c.currentTime + 0.01 + at;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) {}
  },
  tick() { this.tone(880, 0.12); buzz(40); },
  go() { this.tone(1320, 0.4, { vol: 0.36 }); buzz(160); },
  done() { this.tone(784, 0.16); this.tone(1047, 0.16, { at: 0.16 }); this.tone(1568, 0.38, { at: 0.32 }); buzz([90, 60, 160]); },
  switch() { this.tone(660, 0.16); this.tone(990, 0.3, { at: 0.18 }); buzz([80, 60, 80]); },
};
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

const Voice = {
  voice: null,
  supported: 'speechSynthesis' in window,
  pick() {
    if (!this.supported) return;
    const vs = speechSynthesis.getVoices() || [];
    const de = vs.filter(v => /^de(-|_|$)/i.test(v.lang));
    this.voice = de.find(v => /de[-_]DE/i.test(v.lang) && v.localService) || de.find(v => /de[-_]DE/i.test(v.lang)) || de[0] || null;
  },
  unlock() {
    if (!this.supported) return;
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; u.lang = 'de-DE'; speechSynthesis.speak(u); } catch (e) {}
  },
  say(text) {
    if (!this.supported || !data.settings.voice || document.visibilityState === 'hidden') return;
    try {
      const speak = () => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'de-DE'; u.rate = 1.02; u.pitch = 1;
        if (this.voice) u.voice = this.voice;
        speechSynthesis.speak(u);
      };
      if (speechSynthesis.speaking || speechSynthesis.pending) { speechSynthesis.cancel(); setTimeout(speak, 60); }
      else speak();
    } catch (e) {}
  },
};
if (Voice.supported) { Voice.pick(); try { speechSynthesis.addEventListener('voiceschanged', () => Voice.pick()); } catch (e) {} }

const Wake = {
  lock: null, want: false,
  async on() {
    this.want = true;
    if (!('wakeLock' in navigator) || this.lock || document.visibilityState !== 'visible') return;
    try {
      this.lock = await navigator.wakeLock.request('screen');
      this.lock.addEventListener('release', () => { this.lock = null; });
    } catch (e) { this.lock = null; }
  },
  async off() {
    this.want = false;
    try { if (this.lock) await this.lock.release(); } catch (e) {}
    this.lock = null;
  },
};
function unlockSignals() { Sound.unlock(); Voice.unlock(); }

/* ---- Dialog (Bottom Sheet) ---- */
let dialogResolve = null;
function dialog({ title, text = '', html = '', actions }) {
  if (dialogResolve) { dialogResolve(null); dialogResolve = null; }
  return new Promise(resolve => {
    const root = $('#modal-root');
    root.innerHTML = `<div class="sheet-backdrop" data-close="1"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dlg-t">
        <h2 id="dlg-t">${esc(title)}</h2>
        ${text ? `<p>${esc(text)}</p>` : ''}${html}
        <div class="sheet-actions">${actions.map((a, i) => `<button class="btn btn-block btn-${a.kind || 'secondary'}" data-dlg="${i}">${esc(a.label)}</button>`).join('')}</div>
      </div>`;
    root.classList.add('open');
    const prevFocus = document.activeElement;
    const close = v => {
      root.classList.remove('open'); root.innerHTML = ''; root.onclick = null;
      document.removeEventListener('keydown', onKey);
      dialogResolve = null;
      try { prevFocus && prevFocus.focus && prevFocus.focus({ preventScroll: true }); } catch (e) {}
      resolve(v);
    };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    dialogResolve = resolve;
    root.onclick = e => {
      const b = e.target.closest('[data-dlg]');
      if (b) close(actions[+b.dataset.dlg].value);
      else if (e.target.dataset.close) close(null);
    };
    document.addEventListener('keydown', onKey);
    setTimeout(() => { const f = root.querySelector('[data-dlg]'); f && f.focus({ preventScroll: true }); }, 30);
  });
}
function confirmDialog(title, text, okLabel = 'OK', kind = 'primary') {
  return dialog({ title, text, actions: [{ label: okLabel, value: true, kind }, { label: 'Abbrechen', value: false }] });
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
